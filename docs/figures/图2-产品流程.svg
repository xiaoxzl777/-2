<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs><rect width="1400" height="600" fill="#fff"/><rect x="40.0" y="40.0" width="210.0" height="90.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="145.0" y="73.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">① 选求职方向</text><text x="145.0" y="90.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">计算机 / 运营</text><text x="145.0" y="107.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">决定模板、诊断标准和面试官</text><rect x="290.0" y="40.0" width="210.0" height="90.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="395.0" y="73.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">② 选目标岗位</text><text x="395.0" y="90.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">粘贴招聘 JD，自动拆成要求</text><text x="395.0" y="107.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">或选这个方向的内置模板</text><rect x="540.0" y="40.0" width="210.0" height="90.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="645.0" y="73.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">③ 选简历</text><text x="645.0" y="90.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">上传 PDF（后台解析）</text><text x="645.0" y="107.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">或用已经上传过的</text><rect x="790.0" y="40.0" width="260.0" height="90.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="920.0" y="73.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">投递：后台跑图 A</text><text x="920.0" y="90.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">等解析完 → 诊断 ∥ 匹配 → 初筛</text><text x="920.0" y="107.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">每一步的进度实时推送</text><rect x="1090.0" y="40.0" width="270.0" height="90.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1225.0" y="73.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">④ 初筛结果</text><text x="1225.0" y="90.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">匹配度、四项分、是否过线</text><text x="1225.0" y="107.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">单独网址，刷新不丢</text><polyline points="250.0,85.0 290.0,85.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="500.0,85.0 540.0,85.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="750.0,85.0 790.0,85.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="1050.0,85.0 1090.0,85.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="700.0" y="250.0" width="310.0" height="90.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="855.0" y="283.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">哪里不符合（没过初筛时重点看）</text><text x="855.0" y="300.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">对照岗位的差距 + 简历自身的问题</text><text x="855.0" y="317.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">点一条 → 原文高亮 + 现场生成具体建议</text><rect x="1090.0" y="250.0" width="270.0" height="90.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1225.0" y="283.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">⑤ 面试准备</text><text x="1225.0" y="300.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">可贴面经 / 公司介绍（选填）</text><text x="1225.0" y="317.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">创建时定好 5 个话题</text><polyline points="1225.0,130.0 1225.0,250.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="1233.0" y="195.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">通过：正常模式</text><polyline points="1110.0,130.0 1110.0,190.0 855.0,190.0 855.0,250.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="980.0" y="183.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">没通过</text><polyline points="1010.0,295.0 1090.0,295.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="1050.0" y="287.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">练习模式</text><polyline points="700.0,295.0 645.0,295.0 645.0,130.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="637.0" y="215.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="end">改完简历重新投</text><rect x="1090.0" y="420.0" width="270.0" height="100.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1225.0" y="449.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">⑥ 模拟面试（图 B）</text><text x="1225.0" y="466.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">一轮专业面 · 5 个话题</text><text x="1225.0" y="483.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">每个话题最多追问 1 次</text><text x="1225.0" y="500.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">练习模式每题答完马上点评</text><rect x="700.0" y="420.0" width="310.0" height="100.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="855.0" y="449.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">⑦ 面试报告</text><text x="855.0" y="466.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">通过 / 没通过：完整总结 + 改进建议</text><text x="855.0" y="483.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">练习模式、没聊完：不下通过结论</text><text x="855.0" y="500.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">逐题回顾 · 和简历问题的关联</text><rect x="40.0" y="420.0" width="330.0" height="100.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4"/><text x="205.0" y="449.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">我的投递</text><text x="205.0" y="466.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">所有投递新的在前，回看初筛结果</text><text x="205.0" y="483.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">这次投递下的面试挂在卡片上</text><text x="205.0" y="500.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">没面完的接着面，面完的看报告</text><polyline points="1225.0,340.0 1225.0,420.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="1090.0,470.0 1010.0,470.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="370.0,470.0 700.0,470.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 4"/><text x="535.0" y="462.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">回看</text><rect x="40.0" y="556.0" width="26.0" height="16.0" rx="4" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="74.0" y="569.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">用户操作的页面</text><rect x="197.5" y="556.0" width="26.0" height="16.0" rx="4" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="231.5" y="569.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">后台自动运行（调用模型）</text><rect x="417.5" y="556.0" width="26.0" height="16.0" rx="4" fill="#fff" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4"/><text x="451.5" y="569.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">随时可以进入的列表页</text></svg>
