<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs><rect width="1440" height="790" fill="#fff"/><rect x="24.0" y="20.0" width="1392.0" height="176.0" rx="12" fill="#f2f2f2" stroke="#333333" stroke-width="1.4"/><text x="40.0" y="43.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">解析（不在图里）：上传简历时由后台任务触发，按顺序调用 parser/ 里的函数，最后一次落库</text><rect x="44.0" y="56.0" width="146.0" height="120.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="117.0" y="95.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">抽取</text><text x="117.0" y="112.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">PyMuPDF 按行取字</text><text x="117.0" y="129.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">找表格</text><text x="117.0" y="146.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">extract</text><rect x="216.3" y="56.0" width="146.0" height="120.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="289.3" y="95.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">版面</text><text x="289.3" y="112.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">分栏 · 表格 · 时间轴</text><text x="289.3" y="129.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">定下 full_text</text><text x="289.3" y="146.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">layout</text><polyline points="190.0,116.0 216.3,116.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="388.6" y="56.0" width="146.0" height="120.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="461.6" y="104.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">章节识别</text><text x="461.6" y="121.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">词典 + 版面打分</text><text x="461.6" y="138.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">section</text><polyline points="362.3,116.0 388.6,116.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="560.9" y="56.0" width="146.0" height="120.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="633.9" y="104.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">基本信息</text><text x="633.9" y="121.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">本地抽取，不外发</text><text x="633.9" y="138.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">basics</text><polyline points="534.6,116.0 560.9,116.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="733.1" y="56.0" width="146.0" height="120.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="806.1" y="95.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">章节兜底</text><text x="806.1" y="112.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">认不出的标题</text><text x="806.1" y="129.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">交模型归类</text><text x="806.1" y="146.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">section_llm</text><polyline points="706.9,116.0 733.1,116.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="905.4" y="56.0" width="146.0" height="120.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="978.4" y="95.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">结构化</text><text x="978.4" y="112.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">模型只回块编号</text><text x="978.4" y="129.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">日期本地归一化</text><text x="978.4" y="146.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">structure</text><polyline points="879.1,116.0 905.4,116.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="1077.7" y="56.0" width="146.0" height="120.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1150.7" y="104.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">技能提及</text><text x="1150.7" y="121.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">词典扫技能</text><text x="1150.7" y="138.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">mentions</text><polyline points="1051.4,116.0 1077.7,116.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="1250.0" y="56.0" width="146.0" height="120.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1323.0" y="104.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">落库</text><text x="1323.0" y="121.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">同一事务写入</text><text x="1323.0" y="138.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">出错也标失败</text><polyline points="1223.7,116.0 1250.0,116.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="720.0,196.0 720.0,236.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="730.0" y="221.0" font-size="12" font-weight="400" fill="#555555" text-anchor="start">解析完才开始（投递时还没解析完就先等）</text><rect x="24.0" y="236.0" width="1392.0" height="470.0" rx="12" fill="#f2f2f2" stroke="#333333" stroke-width="1.4"/><text x="40.0" y="259.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">图 A · 投递流水线（POST /apply 触发；每过一个节点推送一次进度）</text><circle cx="70" cy="460" r="17" fill="#1a1a1a"/><text x="70.0" y="464.0" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">开始</text><rect x="130.0" y="280.0" width="1032.0" height="160.0" rx="12" fill="#e6e6e6" stroke="#333333" stroke-width="1.4"/><text x="146.0" y="303.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">diagnose 子图：诊断简历本身</text><rect x="150.0" y="316.0" width="176.0" height="108.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="238.0" y="358.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">规则扫描</text><text x="238.0" y="375.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">7 条规则</text><text x="238.0" y="392.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">rule_scan</text><rect x="354.0" y="316.0" width="176.0" height="108.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="442.0" y="349.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">送审计划</text><text x="442.0" y="366.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">成本预检，选出</text><text x="442.0" y="383.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">要送审的单元</text><text x="442.0" y="400.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">plan_review</text><polyline points="326.0,370.0 354.0,370.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="566.0" y="308.0" width="176.0" height="108.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><rect x="562.0" y="312.0" width="176.0" height="108.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><rect x="558.0" y="316.0" width="176.0" height="108.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="646.0" y="341.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">逐条审阅 × N</text><text x="646.0" y="358.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">Send：每条描述一个分支</text><text x="646.0" y="375.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">模型审阅 → 引用逐字校验</text><text x="646.0" y="392.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">对不上带原因重试 ≤ 2 次</text><text x="646.0" y="409.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">review_unit</text><polyline points="530.0,370.0 558.0,370.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="762.0" y="316.0" width="176.0" height="108.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="850.0" y="349.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">合并去重</text><text x="850.0" y="366.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">同一维度、证据重叠</text><text x="850.0" y="383.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">超过一半的只留规则</text><text x="850.0" y="400.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">merge_findings</text><polyline points="734.0,370.0 762.0,370.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="966.0" y="316.0" width="176.0" height="108.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1054.0" y="349.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">五维打分</text><text x="1054.0" y="366.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">从 100 分往下扣</text><text x="1054.0" y="383.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">按经历条数摊薄</text><text x="1054.0" y="400.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">score</text><polyline points="938.0,370.0 966.0,370.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="130.0" y="470.0" width="1032.0" height="160.0" rx="12" fill="#e6e6e6" stroke="#333333" stroke-width="1.4"/><text x="146.0" y="493.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">match 子图：对照岗位要求</text><rect x="150.0" y="506.0" width="176.0" height="108.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="238.0" y="539.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">规则先判</text><text x="238.0" y="556.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">技能名本身、学历、年限</text><text x="238.0" y="573.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">只判十拿九稳的</text><text x="238.0" y="590.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">rule_match</text><rect x="558.0" y="506.0" width="176.0" height="108.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="646.0" y="531.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">全文判断</text><text x="646.0" y="548.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">其余要求连同简历全文</text><text x="646.0" y="565.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">一次交给模型</text><text x="646.0" y="582.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">依据须逐字引用简历</text><text x="646.0" y="599.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">judge_fulltext</text><polyline points="326.0,560.0 558.0,560.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="966.0" y="506.0" width="176.0" height="108.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1054.0" y="539.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">加权算分</text><text x="1054.0" y="556.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">按权重公式</text><text x="1054.0" y="573.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">算匹配度</text><text x="1054.0" y="590.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">score_match</text><polyline points="734.0,560.0 966.0,560.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="87.0,460.0 110.0,460.0 110.0,370.0 150.0,370.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="110.0,460.0 110.0,560.0 150.0,560.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="1142.0,370.0 1180.0,370.0 1180.0,460.0 1196.0,460.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><polyline points="1142.0,560.0 1180.0,560.0 1180.0,460.0" fill="none" stroke="#333333" stroke-width="1.4"/><rect x="1196.0" y="420.0" width="120.0" height="80.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1256.0" y="448.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">初筛</text><text x="1256.0" y="465.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">匹配度 ≥ 60</text><text x="1256.0" y="482.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">gate</text><polyline points="1316.0,460.0 1353.0,460.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><circle cx="1370" cy="460" r="17" fill="#1a1a1a"/><text x="1370.0" y="464.0" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">结束</text><text x="130.0" y="662.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">· 两个子图并行、互不依赖，都完成才到初筛；每个子图也能单独调用（评测做消融时直接调）。</text><text x="130.0" y="686.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">· 对照实验开关：诊断 rule_only / llm_only / hybrid，匹配 dict_only / llm_fulltext / hybrid，线上都用 hybrid。</text><rect x="40.0" y="738.0" width="26.0" height="16.0" rx="4" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="74.0" y="751.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">纯函数（不调模型）</text><rect x="222.5" y="738.0" width="26.0" height="16.0" rx="4" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="256.5" y="751.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">调用模型（都经 llm/；模型引用的原文要过 locate_span 逐字核对）</text></svg>
