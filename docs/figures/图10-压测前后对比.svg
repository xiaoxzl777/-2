x="0" fill="#3d3d3d" stroke="#333333" stroke-width="1"/><text x="473.0" y="144.5" font-size="11" font-weight="400" fill="#1a1a1a" text-anchor="middle">105</text><text x="450.0" y="432.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">200 人</text><text x="450.0" y="448.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">P95 31 s → 0.8 s</text><text x="450.0" y="464.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">失败 13% → 0</text><text x="660.0" y="74.0" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">(b) N 个人同一秒点「投递」</text><polyline points="660.0,412.0 1140.0,412.0" fill="none" stroke="#333333" stroke-width="1.4"/><text x="652.0" y="416.0" font-size="12" font-weight="400" fill="#555555" text-anchor="end">0</text><polyline points="660.0,352.0 1140.0,352.0" fill="none" stroke="#d0d0d0" stroke-width="1"/><text x="652.0" y="356.0" font-size="12" font-weight="400" fill="#555555" text-anchor="end">20</text><polyline points="660.0,292.0 1140.0,292.0" fill="none" stroke="#d0d0d0" stroke-width="1"/><text x="652.0" y="296.0" font-size="12" font-weight="400" fill="#555555" text-anchor="end">40</text><polyline points="660.0,232.0 1140.0,232.0" fill="none" stroke="#d0d0d0" stroke-width="1"/><text x="652.0" y="236.0" font-size="12" font-weight="400" fill="#555555" text-anchor="end">60</text><polyline points="660.0,172.0 1140.0,172.0" fill="none" stroke="#d0d0d0" stroke-width="1"/><text x="652.0" y="176.0" font-size="12" font-weight="400" fill="#555555" text-anchor="end">80</text><polyline points="660.0,112.0 1140.0,112.0" fill="none" stroke="#d0d0d0" stroke-width="1"/><text x="652.0" y="116.0" font-size="12" font-weight="400" fill="#555555" text-anchor="end">100</text><text x="612.0" y="262.0" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 612.0 262.0)">投递成功的比例（%）</text><rect x="671.6" y="112.0" width="35.4" height="300.0" rx="0" fill="#ffffff" st