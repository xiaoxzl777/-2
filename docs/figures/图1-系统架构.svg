<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs><rect width="1400" height="930" fill="#fff"/><rect x="40.0" y="24.0" width="1320.0" height="72.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="700.0" y="57.0" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">浏览器 · 前端单页应用（React 18 + TypeScript + Vite）</text><text x="700.0" y="75.0" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">工作台（选方向 → 选岗位 → 选简历 → 投递）· 初筛结果与原文高亮 · 模拟面试 · 我的投递</text><polyline points="508.0,96.0 508.0,162.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="518.0" y="117.0" font-size="12" font-weight="400" fill="#555555" text-anchor="start">HTTP 接口 / SSE 流式推送</text><rect x="24.0" y="128.0" width="1352.0" height="680.0" rx="14" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1360.0" y="150.0" font-size="13" font-weight="400" fill="#555555" text-anchor="end">Docker Compose（本机一条命令部署）</text><rect x="48.0" y="164.0" width="920.0" height="58.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="508.0" y="189.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Nginx</text><text x="508.0" y="207.0" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">前端静态文件 · /api 反向代理（关闭缓冲，流式输出不被攒包）</text><polyline points="508.0,222.0 508.0,250.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="48.0" y="250.0" width="920.0" height="540.0" rx="12" fill="#f2f2f2" stroke="#333333" stroke-width="1.4"/><text x="64.0" y="273.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">后端 · FastAPI（Python 3.13，uvicorn 单进程）</text><rect x="72.0" y="290.0" width="872.0" height="56.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="508.0" y="314.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">接口层 api/</text><text x="508.0" y="332.0" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">认证 · 简历 · 岗位 · 投递 · 具体建议 · 模拟面试 · 进度推送（SSE）</text><polyline points="508.0,346.0 508.0,362.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="72.0" y="362.0" width="872.0" height="56.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="508.0" y="386.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">服务层 services/</text><text x="508.0" y="404.0" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">读写数据库 · 后台任务 · 跑图并把每一步转成进度 · 中断任务清理</text><polyline points="508.0,418.0 508.0,434.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="72.0" y="434.0" width="872.0" height="266.0" rx="12" fill="#e6e6e6" stroke="#333333" stroke-width="1.4"/><text x="88.0" y="457.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">领域层（纯数据进出，不碰数据库）</text><rect x="92.0" y="468.0" width="832.0" height="56.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="508.0" y="492.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">parser/ 简历解析</text><text x="508.0" y="510.0" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">PyMuPDF 抽取 → 分栏 / 表格 / 时间轴 → 章节识别 → 个人信息掩码 → 结构化（模型只回块编号）</text><rect x="92.0" y="538.0" width="410.0" height="56.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="297.0" y="562.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">图 A · 投递流水线（LangGraph）</text><text x="297.0" y="580.0" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">诊断子图 ∥ 匹配子图（并行）→ 初筛</text><rect x="514.0" y="538.0" width="410.0" height="56.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="719.0" y="562.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">图 B · 模拟面试（LangGraph）</text><text x="719.0" y="580.0" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">定话题 → 出题 → 等回答（interrupt）→ 评分 → 追问 / 换题</text><rect x="92.0" y="608.0" width="156.8" height="76.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="170.4" y="642.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">diagnose/ 诊断</text><text x="170.4" y="659.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">7 条规则 + 模型审阅</text><rect x="260.8" y="608.0" width="156.8" height="76.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="339.2" y="642.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">matching/ 匹配</text><text x="339.2" y="659.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">规则先判 + 全文判断</text><rect x="429.6" y="608.0" width="156.8" height="76.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="508.0" y="642.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">interview/ 面试</text><text x="508.0" y="659.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">话题 · 评分 · 追问策略</text><rect x="598.4" y="608.0" width="156.8" height="76.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="676.8" y="642.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">rewrite/ 具体建议</text><text x="676.8" y="659.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">流式生成 + 数字复检</text><rect x="767.2" y="608.0" width="156.8" height="76.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="845.6" y="642.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">domains/ 领域包</text><text x="845.6" y="659.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">计算机 / 运营 / 财会</text><polyline points="508.0,700.0 508.0,716.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="72.0" y="716.0" width="284.0" height="58.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="214.0" y="741.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">retrieval/ 面经检索</text><text x="214.0" y="758.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">切段 → 向量召回 → 重排取前 3 段</text><rect x="366.0" y="716.0" width="284.0" height="58.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="508.0" y="741.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">证据校验 locate_span</text><text x="508.0" y="758.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">模型引用的原文必须逐字找得到</text><rect x="660.0" y="716.0" width="284.0" height="58.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="802.0" y="741.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">llm/ 模型调用唯一出口</text><text x="802.0" y="758.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">缓存 · 限流 · 记账 · 校验失败带原因重试</text><rect x="1000.0" y="250.0" width="352.0" height="540.0" rx="12" fill="#f2f2f2" stroke="#333333" stroke-width="1.4"/><text x="1016.0" y="273.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="start">存储</text><rect x="1016.0" y="290.0" width="320.0" height="128.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1176.0" y="324.0" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle">MySQL 8.0</text><text x="1176.0" y="352.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">11 张表：用户、简历与解析块、</text><text x="1176.0" y="371.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">诊断与问题、岗位、投递、技能词典、</text><text x="1176.0" y="390.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">面试与问答、模型调用审计</text><rect x="1016.0" y="434.0" width="320.0" height="74.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1176.0" y="468.0" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Redis</text><text x="1176.0" y="485.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">模型结果缓存 · 限流 · 进度推送（发布 / 订阅）</text><rect x="1016.0" y="524.0" width="320.0" height="74.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1176.0" y="558.0" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Chroma（嵌入式）</text><text x="1176.0" y="575.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">面经切段的向量（面经超过 3000 字才用）</text><rect x="1016.0" y="614.0" width="320.0" height="74.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1176.0" y="648.0" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">SQLite 文件</text><text x="1176.0" y="665.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">图 B 检查点：停下等回答时保存状态</text><text x="1176.0" y="724.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">Chroma、SQLite 和上传的 PDF</text><text x="1176.0" y="742.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">都在后端的数据卷里</text><polyline points="968.0,354.0 1016.0,354.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/><polyline points="968.0,471.0 1016.0,471.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/><polyline points="968.0,561.0 1016.0,561.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/><polyline points="968.0,651.0 1016.0,651.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ah)"/><polyline points="760.0,774.0 760.0,846.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="768.0" y="840.0" font-size="12" font-weight="400" fill="#555555" text-anchor="start">HTTPS</text><polyline points="900.0,774.0 900.0,830.0 1134.0,830.0 1134.0,846.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="1017.0" y="825.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">HTTPS</text><rect x="480.0" y="846.0" width="560.0" height="58.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4"/><text x="760.0" y="871.5" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">DeepSeek API · deepseek-chat</text><text x="760.0" y="889.5" font-size="13" font-weight="400" fill="#555555" text-anchor="middle">诊断审阅 · 匹配判断 · JD 拆解 · 具体建议 · 面试出题与评分</text><rect x="1056.0" y="846.0" width="296.0" height="58.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1204.0" y="872.0" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">硅基流动 API</text><text x="1204.0" y="889.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">bge-m3 向量 · bge-reranker 重排</text><text x="72.0" y="880.0" font-size="13" font-weight="400" fill="#555555" text-anchor="start">外部模型服务（全部走 API，无本地模型）</text></svg>
