<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="620" viewBox="0 0 1460 620" font-family="Microsoft YaHei, SimHei, PingFang SC, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs><rect width="1460" height="620" fill="#fff"/><circle cx="50" cy="300" r="17" fill="#1a1a1a"/><text x="50.0" y="304.0" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">开始</text><polyline points="67.0,300.0 90.0,300.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="90.0" y="250.0" width="160.0" height="100.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="170.0" y="279.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">定话题</text><text x="170.0" y="296.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">模型定 5 个话题</text><text x="170.0" y="313.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">每个指向一条材料</text><text x="170.0" y="330.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">plan_interview</text><rect x="290.0" y="250.0" width="130.0" height="100.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="355.0" y="288.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">取话题</text><text x="355.0" y="305.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">下一个话题</text><text x="355.0" y="322.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">pick_topic</text><polyline points="250.0,300.0 290.0,300.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="460.0" y="250.0" width="170.0" height="100.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="545.0" y="279.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">查面经</text><text x="545.0" y="296.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">只查用户贴的面经</text><text x="545.0" y="313.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">不长就整段给</text><text x="545.0" y="330.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">retrieve_context</text><polyline points="420.0,300.0 460.0,300.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="670.0" y="250.0" width="150.0" height="100.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="745.0" y="288.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">出题</text><text x="745.0" y="305.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">模型流式输出</text><text x="745.0" y="322.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">ask_question</text><polyline points="630.0,300.0 670.0,300.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="860.0" y="250.0" width="170.0" height="100.0" rx="8" fill="#fff" stroke="#333333" stroke-width="2.8"/><text x="945.0" y="279.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">等回答 ★</text><text x="945.0" y="296.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">interrupt() 停住</text><text x="945.0" y="313.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">检查点存 SQLite</text><text x="945.0" y="330.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">wait_answer</text><polyline points="820.0,300.0 860.0,300.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="1070.0" y="250.0" width="170.0" height="100.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="1155.0" y="279.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">评分</text><text x="1155.0" y="296.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">按 rubric 三项打分</text><text x="1155.0" y="313.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">依据逐字引用回答</text><text x="1155.0" y="330.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">evaluate_answer</text><polyline points="1030.0,300.0 1070.0,300.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="1280.0" y="250.0" width="150.0" height="100.0" rx="8" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="1355.0" y="288.0" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">决定下一步</text><text x="1355.0" y="305.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">看花费、追问次数</text><text x="1355.0" y="322.0" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">decide</text><polyline points="1240.0,300.0 1280.0,300.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><rect x="560.0" y="70.0" width="200.0" height="84.0" rx="8" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="660.0" y="91.5" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">出报告</text><text x="660.0" y="108.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">分数纯函数聚合</text><text x="660.0" y="125.5" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">模型只写文字总结</text><text x="660.0" y="142.5" font-size="11.5" font-weight="400" fill="#555555" text-anchor="middle" font-family="Consolas, Menlo, monospace">final_report</text><polyline points="760.0,112.0 803.0,112.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><circle cx="820" cy="112" r="17" fill="#1a1a1a"/><text x="820.0" y="116.0" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">结束</text><polyline points="355.0,250.0 355.0,112.0 560.0,112.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="363.0" y="190.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">话题用完</text><polyline points="1355.0,250.0 1355.0,40.0 660.0,40.0 660.0,70.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="1000.0" y="33.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">finish：花费到上限</text><polyline points="1330.0,350.0 1330.0,400.0 745.0,400.0 745.0,350.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="1040.0" y="393.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">followup：追问（每个话题最多 1 次，跳过的不追问）</text><polyline points="1380.0,350.0 1380.0,450.0 355.0,450.0 355.0,350.0" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah)"/><text x="860.0" y="443.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="middle">next：换下一个话题</text><polyline points="270.0,220.0 270.0,372.0" fill="none" stroke="#777" stroke-width="1.4" stroke-dasharray="6 4"/><text x="270.0" y="210.0" font-size="12" font-weight="400" fill="#555555" text-anchor="middle">创建会话只跑到这里</text><text x="40.0" y="500.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">· 创建会话（POST /interviews）只跑完「定话题」就停；开始面试（POST /start）接着跑到第一题的「等回答」。</text><text x="40.0" y="524.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">· 每次提交回答：先落库，再从「等回答」原地继续；跳过的题记 0 分、不调模型。提前结束不经过图，按已答的题直接出报告。</text><text x="40.0" y="548.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">· 练习模式每题答完马上显示评分；正常模式答题时不显示，结束后看报告。两种模式后台都逐题评分（追问要用）。</text><rect x="40.0" y="582.0" width="26.0" height="16.0" rx="4" fill="#fff" stroke="#333333" stroke-width="1.4"/><text x="74.0" y="595.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">纯函数</text><rect x="147.5" y="582.0" width="26.0" height="16.0" rx="4" fill="#d9d9d9" stroke="#333333" stroke-width="1.4"/><text x="181.5" y="595.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">调用模型</text><rect x="267.5" y="582.0" width="26.0" height="16.0" rx="4" fill="#fff" stroke="#333333" stroke-width="2.6"/><text x="301.5" y="595.0" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">等人输入（interrupt）</text></svg>
