<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的投递 · 求职辅助</title>
<style>
  :root {
    --cream: #f6f0e6; --cream-2: #efe6d7; --paper: #fffaf2;
    --ink: #221d17; --ink-2: #6b6157; --ink-3: #8a7f73;
    --line: rgba(34,29,23,.1);
    --accent: #d9542b; --accent-ink: #b8431f;
    --good: #2f7d4f; --warn: #b7791f; --bad: #c2362b;
    --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); overflow-x: hidden;
    font-family: "PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  ::selection { background: rgba(217,84,43,.2); }
  .grain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35; background-image: radial-gradient(rgba(34,29,23,.08) 1px, transparent 1px); background-size: 22px 22px; }
  .glow { position: fixed; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, rgba(242,140,90,.28) 0%, rgba(242,140,90,0) 65%); }
  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 32px; }

  /* ── 导航（同工作台）：多了「我的投递」 ── */
  nav { position: sticky; top: 0; z-index: 20; padding: 18px 0; }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .5px; }
  .logo-mark { width: 30px; height: 30px; border-radius: 10px; background: var(--ink); color: var(--cream); display: grid; place-items: center; font-size: 15px; transition: transform .5s var(--spring); }
  .logo:hover .logo-mark { transform: rotate(-12deg) scale(1.08); }
  .links { display: flex; gap: 4px; }
  .links a { padding: 8px 14px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 15px; transition: background .2s, color .2s; }
  .links a:hover { background: rgba(34,29,23,.06); color: var(--ink); }
  .links a.on { color: var(--ink); font-weight: 600; }
  .me { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .progress { position: relative; z-index: 1; height: 3px; background: rgba(34,29,23,.06); }

  /* ── 按钮（同首页） ── */
  .btn { position: relative; height: 44px; padding: 0 22px; border-radius: 999px; border: none; font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .35s var(--spring), background .2s, box-shadow .3s; will-change: transform; }
  .btn.ghost { background: transparent; } .btn.ghost:hover { background: rgba(34,29,23,.06); }
  .btn.accent { background: var(--accent); color: #fff; } .btn.accent:hover { background: var(--accent-ink); box-shadow: 0 12px 28px rgba(217,84,43,.3); }
  .btn .arrow { transition: transform .35s var(--spring); } .btn:hover .arrow { transform: translateX(4px); }
  .btn:active { transform: scale(.96) !important; }

  /* ── 页头 ── */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; flex-wrap: wrap; padding: 48px 0 28px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); font-size: 13px; color: var(--ink-2); }
  .tag b { padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--cream); font-weight: 600; font-size: 12px; }
  h1 { margin: 22px 0 16px; font-size: clamp(36px, 4.4vw, 56px); line-height: 1.14; letter-spacing: -1px; font-weight: 800; }
  h1 .line { display: block; overflow: hidden; padding-bottom: 6px; }
  h1 .line > span { display: inline-block; transform: translateY(110%); animation: rise .9s var(--ease) forwards; }
  h1 .line:nth-child(2) > span { animation-delay: .1s; }
  .mark { position: relative; white-space: nowrap; }
  .mark svg { position: absolute; left: -4%; bottom: -8px; width: 108%; height: 20px; overflow: visible; }
  .mark path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1s .7s var(--ease) forwards; }
  .sub { margin: 0; max-width: 520px; font-size: 17px; line-height: 1.7; color: var(--ink-2); }
  .stats { display: flex; gap: 10px; }
  .stat { min-width: 104px; padding: 14px 18px; border-radius: 18px; background: var(--paper); box-shadow: 0 0 0 1px var(--line), 0 16px 30px -18px rgba(80,50,20,.3); }
  .stat b { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--ink-3); }
  .fade { opacity: 0; transform: translateY(18px); animation: fadeUp .8s var(--ease) forwards; }
  .d1 { animation-delay: .2s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .5s; }
  @keyframes rise { to { transform: none; } }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ── 工具条：筛选 + 新的投递 ── */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: auto; padding: 4px; border-radius: 999px; background: var(--cream-2); }
  .seg .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 999px; background: var(--paper); box-shadow: 0 2px 8px rgba(80,50,20,.12); transition: transform .45s var(--spring), width .3s; }
  .seg button { position: relative; z-index: 1; height: 34px; padding: 0 16px; border: none; background: none; font-weight: 600; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
  .seg button.on { color: var(--ink); }
  .seg button i { font-style: normal; margin-left: 4px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* ── 一条投递（类名带 ap- 前缀，免得和 index.css 里的全局类撞） ── */
  .ap-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 90px; }
  .ap { border-radius: 22px; background: var(--paper); box-shadow: 0 0 0 1px var(--line), 0 18px 36px -24px rgba(80,50,20,.35);
    opacity: 0; transform: translateY(14px); animation: fadeUp .6s var(--ease) forwards; transition: box-shadow .25s; }
  .ap:hover { box-shadow: 0 0 0 1.5px var(--ink-3), 0 22px 40px -22px rgba(80,50,20,.4); }
  .ap-main { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 24px; align-items: center; gap: 16px; width: 100%; padding: 18px 20px; border: none; background: none; text-align: left; border-radius: 22px; }
  .ap-ic { width: 52px; height: 52px; border-radius: 15px; background: var(--cream-2); display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--ink-2); }
  .ap.pass .ap-ic { background: var(--ink); color: var(--cream); }
  .ap-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 17px; }
  .ap-title .co { font-weight: 600; font-size: 14px; color: var(--ink-3); }
  .ap-dir { height: 22px; padding: 0 9px; border-radius: 999px; background: var(--cream-2); font-size: 12px; font-weight: 700; color: var(--ink-2); display: inline-grid; place-items: center; }
  .ap-meta { margin-top: 4px; font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ap-meta b { font-weight: 600; color: var(--ink-2); }
  .ap-go { color: var(--ink-3); font-size: 20px; transition: transform .35s var(--spring), color .2s; }
  .ap-main:hover .ap-go { transform: translateX(4px); color: var(--ink); }

  /* 右侧：匹配度小环 + 结论 */
  .ap-res { display: flex; align-items: center; gap: 12px; }
  .ap-ring { position: relative; width: 52px; height: 52px; flex: none; }
  .ap-ring svg { transform: rotate(-90deg); }
  .ap-ring circle { fill: none; stroke-width: 5; }
  .ap-ring .tr { stroke: var(--cream-2); }
  .ap-ring .br { stroke: var(--ink-3); stroke-linecap: round; stroke-dasharray: 138.2; transition: stroke-dashoffset 1.2s var(--ease); }
  .ap.pass .ap-ring .br { stroke: var(--accent); }
  .ap-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ap-badge { height: 26px; padding: 0 11px; border-radius: 999px; font-size: 13px; font-weight: 700; display: inline-grid; place-items: center; white-space: nowrap; }
  .ap-badge.ok { background: rgba(47,125,79,.12); color: var(--good); }
  .ap-badge.no { background: rgba(183,121,31,.14); color: var(--warn); }
  .ap-badge.err { background: rgba(194,54,43,.12); color: var(--bad); }
  .ap-badge.run { background: rgba(217,84,43,.1); color: var(--accent-ink); }
  .ap-spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(217,84,43,.25); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ap-res .why { font-size: 12px; color: var(--ink-3); max-width: 180px; text-align: right; line-height: 1.5; }

  /* 下面一行：这次投递面过的场次 + 下一步 */
  .ap-iv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 20px; padding: 12px 0 16px 68px; border-top: 1px dashed var(--line); }
  .ap-iv .k { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: 1px; margin-right: 4px; }
  .ap-pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 10px; border: none; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line);
    font-size: 13px; color: var(--ink-2); transition: box-shadow .2s, transform .3s var(--spring); }
  .ap-pill:hover { box-shadow: inset 0 0 0 1.5px var(--ink-3); transform: translateY(-1px); }
  .ap-pill .m { height: 20px; padding: 0 7px; border-radius: 999px; background: var(--cream-2); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
  .ap-pill .m.prac { background: rgba(217,84,43,.1); color: var(--accent-ink); }
  .ap-pill b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .ap-pill .v-ok { color: var(--good); font-weight: 700; } .ap-pill .v-no { color: var(--warn); font-weight: 700; } .ap-pill .v-mid { color: var(--ink-3); }
  .ap-pill .act { color: var(--accent-ink); font-weight: 700; }
  .ap-pill.live { box-shadow: inset 0 0 0 1.5px rgba(217,84,43,.45); }
  .ap-pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .ap-next { border: none; background: none; padding: 0 4px; font-size: 13px; font-weight: 700; color: var(--accent-ink); }
  .ap-next:hover { text-decoration: underline; }
  .ap-iv .none { font-size: 13px; color: var(--ink-3); }

  /* 空状态 */
  .empty { display: grid; place-items: center; gap: 14px; padding: 64px 20px; border-radius: 28px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); text-align: center; }
  .empty b { font-size: 20px; } .empty p { margin: 0; color: var(--ink-3); font-size: 14px; line-height: 1.7; }
  /* 只显示最近 10 条，更早的点一下再展开（新加的） */
  .ap-more { display: flex; align-items: center; justify-content: center; gap: 8px; width: fit-content; height: 40px; margin: 6px auto 0; padding: 0 20px; border: none; border-radius: 999px;
    background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 14px; font-weight: 600; color: var(--ink-2); transition: box-shadow .2s, color .2s; }
  .ap-more:hover { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .ap-more .ar { transition: transform .35s var(--spring); } .ap-more:hover .ar { transform: translateY(2px); }
  .ap-more.up:hover .ar { transform: translateY(-2px); }
  .filter-empty { padding: 30px 16px; border-radius: 18px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--ink-3); font-size: 14px; text-align: center; }

  /* 只有样稿才有：右下角切换、点击后的提示 */
  .demo-flag { position: fixed; right: 16px; bottom: 16px; z-index: 30; display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--ink); color: var(--cream); }
  .demo-flag span { margin-right: 6px; }
  .demo-flag button { height: 26px; padding: 0 10px; border: none; border-radius: 999px; background: transparent; color: rgba(246,240,230,.6); font-size: 12px; font-weight: 600; }
  .demo-flag button.on { background: var(--cream); color: var(--ink); }
  .toast { position: fixed; left: 50%; bottom: 64px; z-index: 40; transform: translate(-50%, 20px); opacity: 0; padding: 10px 16px; border-radius: 14px; background: var(--ink); color: var(--cream); font-size: 13px;
    transition: opacity .25s, transform .4s var(--spring); pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast code { color: #f4b29a; }

  @media (max-width: 760px) {
    .wrap { padding: 0 16px; } .links a { padding: 8px 10px; font-size: 14px; } .me span:not(.avatar), .me button { display: none; }
    .head { padding-top: 28px; gap: 20px; } .stats { width: 100%; } .stat { flex: 1; min-width: 0; }
    .ap-main { grid-template-columns: 44px minmax(0, 1fr) 16px; gap: 12px; padding: 16px; }
    .ap-ic { width: 44px; height: 44px; font-size: 13px; }
    .ap-res { grid-column: 2 / 4; grid-row: 2; } .ap-go { grid-column: 3; grid-row: 1; }
    .ap-res .why { text-align: left; max-width: none; }
    .ap-iv { margin: 0 16px; padding-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; } .glow { display: none; } }
</style>
</head>
<body>
<div class="grain"></div><div class="glow" id="glow"></div>

<nav>
  <div class="wrap">
    <div class="logo"><span class="logo-mark">求</span>求职辅助</div>
    <div class="links"><a href="#" data-toast="会跳到 <code>/app</code>（工作台，新的投递）">新的投递</a><a href="#" class="on">我的投递</a></div>
    <div class="me"><span class="avatar">U</span><span>user</span><button class="btn ghost" style="height:36px;padding:0 14px;font-size:14px">退出</button></div>
  </div>
</nav>
<div class="progress"></div>

<main class="wrap">
  <header class="head">
    <div>
      <span class="tag fade"><b>记录</b>我的投递</span>
      <h1>
        <span class="line"><span>投过的岗位，</span></span>
        <span class="line"><span>都在<span class="mark">这里<svg viewBox="0 0 300 22" preserveAspectRatio="none"><path d="M4 16 C 80 4, 200 4, 296 12"/></svg></span>。</span></span>
      </h1>
      <p class="sub fade d1">点一条看初筛结果和修改建议。这次投递面过的模拟面试也挂在下面，没面完的可以接着面。</p>
    </div>
    <div class="stats fade d2" id="stats"></div>
  </header>

  <div class="bar fade d3" id="bar">
    <div class="seg" id="seg"><span class="knob"></span></div>
    <button class="btn accent" data-toast="会跳到 <code>/app</code>（工作台，新的投递）">新的投递 <span class="arrow">→</span></button>
  </div>
  <div class="ap-list" id="list"></div>
</main>

<div class="demo-flag"><span>效果预览 · 示例数据</span><button class="on" data-variant="some">有记录</button><button data-variant="none">还没投过</button></div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 光晕 */
let mx = innerWidth/2, my = innerHeight/3, gx = mx, gy = my;
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function loop(){ gx += (mx-gx)*.08; gy += (my-gy)*.08; $('glow').style.transform = `translate(${gx}px,${gy}px)`; requestAnimationFrame(loop); })();

/* 样稿里点了只提示会跳到哪 */
let toastTimer;
function toast(html) { $('toast').innerHTML = html; $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200); }
document.addEventListener('click', e => { const t = e.target.closest('[data-toast]'); if (t) { e.preventDefault(); toast(t.dataset.toast); } });
document.addEventListener('click', e => {
  const m = e.target.closest('[data-more]'); if (!m) return;
  expanded = m.dataset.more === '1'; renderList();
  if (!expanded) $('bar').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });   // 收起后回到列表顶上，不留在一片空白里
});

/* 示例数据（字段对应准备新增的 GET /apply 列表：每条投递 + 它下面的面试） */
const DIR = { cs: '计算机', ops: '运营' };
const APPLIES = [
  { id: 21, title: '用户运营实习生', company: null, dir: 'ops', resume: '运营示例简历.pdf', at: '刚刚', status: 'running', interviews: [] },
  { id: 19, title: '内容运营实习生（新媒体）', company: null, dir: 'ops', resume: '运营示例简历.pdf', at: '10 月 7 日 15:20', status: 'success', score: 81, passed: true,
    interviews: [{ id: 15, mode: 'normal', status: 'in_progress', topic: 3, topics: 5 }] },
  { id: 12, title: '后端开发实习生', company: '示例科技', dir: 'cs', resume: '张同学_后端_2026.pdf', at: '10 月 6 日 20:41', status: 'success', score: 74, passed: true,
    interviews: [{ id: 9, mode: 'normal', status: 'completed', score: 78, verdict: 'pass', at: '10 月 6 日' },
                 { id: 7, mode: 'normal', status: 'completed', verdict: 'incomplete', at: '10 月 6 日' }] },
  { id: 10, title: '算法实习生（机器学习）', company: null, dir: 'cs', resume: '张同学_后端_2026.pdf', at: '10 月 5 日 11:02', status: 'success', score: 38, passed: false,
    interviews: [{ id: 6, mode: 'practice', status: 'completed', score: 65, at: '10 月 5 日' }] },
  { id: 8, title: '前端开发实习生', company: null, dir: 'cs', resume: '张同学_后端_2026.pdf', at: '10 月 3 日 09:15', status: 'success', score: 52, passed: false, interviews: [] },
  { id: 5, title: '测试开发实习生', company: null, dir: 'cs', resume: '扫描版简历.pdf', at: '9 月 30 日 16:48', status: 'failed', error: '简历是扫描件，读不出文字', interviews: [] },
  // 再早的 8 条：凑够超过 10 条，看「显示更早的」
  ...[['数据分析实习生', 'cs', 66, true], ['后端开发实习生（Python / Go）', 'cs', 57, false], ['用户运营实习生', 'ops', 72, true], ['前端开发实习生', 'cs', 44, false],
      ['后端开发实习生', 'cs', 69, true], ['内容运营实习生（新媒体）', 'ops', 49, false], ['测试开发实习生', 'cs', 61, true], ['算法实习生（机器学习）', 'cs', 33, false]]
    .map(([title, dir, score, passed], i) => ({ id: 4 - i, title, company: null, dir, resume: dir === 'ops' ? '运营示例简历.pdf' : '张同学_后端_2026.pdf',
      at: `9 月 ${28 - i * 2} 日 1${i % 10}:0${i}`, status: 'success', score, passed, interviews: [] })),
];
const icOf = (t) => t.replace(/\s/g, '').slice(0, 2);     // 同工作台：图标取标题前两个字

function ivPill(a, v) {
  const mode = v.mode === 'practice' ? '<span class="m prac">练习</span>' : '<span class="m">模拟面试</span>';
  if (v.status === 'in_progress')
    return `<button class="ap-pill live" data-toast="会跳到 <code>/app/interview/${v.id}</code>，接着上次的题面">${mode}进行中 · 第 ${v.topic} / ${v.topics} 个话题<span class="act">继续 →</span></button>`;
  const verdict = v.mode === 'practice' ? '<span class="v-mid">练习不下结论</span>'
    : v.verdict === 'pass' ? '<span class="v-ok">通过</span>' : v.verdict === 'fail' ? '<span class="v-no">没过</span>' : '<span class="v-mid">没做完</span>';
  const score = v.score != null ? `<b>${v.score} 分</b>` : '';
  return `<button class="ap-pill" data-toast="会跳到 <code>/app/interview/${v.id}/report</code>（面试报告）">${mode}${v.at} ${score} ${verdict}<span class="act">报告 →</span></button>`;
}

function row(a, i) {
  const cls = a.status === 'success' && a.passed ? 'ap pass' : 'ap';
  let res;
  if (a.status === 'running')
    res = `<span class="ap-spin"></span><span class="ap-badge run">分析中</span>`;
  else if (a.status === 'failed')
    res = `<span class="why">${esc(a.error)}</span><span class="ap-badge err">分析失败</span>`;
  else {
    const off = (138.2 * (1 - a.score / 100)).toFixed(1);
    res = `<span class="ap-ring"><svg width="52" height="52"><circle class="tr" cx="26" cy="26" r="22"/><circle class="br" cx="26" cy="26" r="22" style="stroke-dashoffset:138.2" data-off="${off}"/></svg><b>${a.score}</b></span>`
        + `<span class="ap-badge ${a.passed ? 'ok' : 'no'}">${a.passed ? '初筛通过' : '未通过'}</span>`;
  }
  // 下面一行：面过的场次；一场都没有时给下一步
  let iv = '';
  if (a.interviews.length) iv = `<span class="k">面试</span>` + a.interviews.map(v => ivPill(a, v)).join('');
  else if (a.status === 'success')
    iv = `<span class="none">还没面试</span><button class="ap-next" data-toast="会跳到 <code>/app/apply/${a.id}/interview</code>（面试准备页）">${a.passed ? '进入模拟面试' : '以练习模式面试'} →</button>`;
  else if (a.status === 'failed')
    iv = `<button class="ap-next" data-toast="会跳到 <code>/app?job=…&amp;resume=…</code>，岗位和简历都带过去">换一份简历重新投递 →</button>`;
  const co = a.company ? `<span class="co">${esc(a.company)}</span>` : '';
  return `<article class="${cls}" style="animation-delay:${i * 60 + 150}ms">
    <button class="ap-main" data-toast="会跳到 <code>/app/apply/${a.id}</code>（初筛结果页）">
      <span class="ap-ic">${icOf(a.title)}</span>
      <div style="min-width:0"><div class="ap-title">${esc(a.title)}${co}<span class="ap-dir">${DIR[a.dir]}</span></div>
        <div class="ap-meta"><b>${esc(a.resume)}</b> · ${a.at}</div></div>
      <div class="ap-res">${res}</div>
      <span class="ap-go">›</span>
    </button>
    ${iv ? `<div class="ap-iv">${iv}</div>` : ''}
  </article>`;
}

/* 筛选 */
const FILTERS = [['all', '全部', () => true], ['pass', '通过', a => a.status === 'success' && a.passed], ['fail', '未通过', a => a.status === 'success' && !a.passed]];
let filter = 'all', data = APPLIES, expanded = false;
const LIMIT = 10;   // 默认只显示最近 10 条
function renderSeg() {
  $('seg').innerHTML = '<span class="knob"></span>' + FILTERS.map(([k, t, f]) =>
    `<button class="${k === filter ? 'on' : ''}" data-f="${k}">${t}<i>${data.filter(f).length}</i></button>`).join('');
  placeKnob();
}
function placeKnob() { const b = $('seg').querySelector('button.on'), k = $('seg').querySelector('.knob'); if (b) { k.style.width = b.offsetWidth + 'px'; k.style.transform = `translateX(${b.offsetLeft - 4}px)`; } }
new ResizeObserver(placeKnob).observe($('seg'));
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; expanded = false; renderSeg(); renderList(); });

function renderList() {
  if (!data.length) {
    $('list').innerHTML = `<div class="empty fade"><b>还没有投递记录</b><p>选一个方向和岗位，传一份简历，<br>投出去之后结果会出现在这里。</p>
      <button class="btn accent" data-toast="会跳到 <code>/app</code>（工作台）">去投第一份 <span class="arrow">→</span></button></div>`;
    return;
  }
  // 先按「全部 / 通过 / 未通过」筛，再取最近 10 条：每个筛选下都是各自最近的 10 条
  const shown = data.filter(FILTERS.find(f => f[0] === filter)[2]);
  const visible = expanded ? shown : shown.slice(0, LIMIT);
  const more = shown.length <= LIMIT ? ''
    : expanded ? `<button class="ap-more up" data-more="0">收起，只看最近 ${LIMIT} 条 <span class="ar">↑</span></button>`
    : `<button class="ap-more" data-more="1">显示更早的 ${shown.length - LIMIT} 条 <span class="ar">↓</span></button>`;
  $('list').innerHTML = shown.length ? visible.map(row).join('') + more : `<div class="filter-empty">没有${filter === 'pass' ? '通过' : '未通过'}的投递。</div>`;
  requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('.ap-ring .br').forEach(c => c.style.strokeDashoffset = c.dataset.off), reduce ? 0 : 200));
}
function renderStats() {
  const ivs = data.reduce((n, a) => n + a.interviews.length, 0);
  const passed = data.filter(a => a.status === 'success' && a.passed).length;
  $('stats').innerHTML = data.length ? `<div class="stat"><b>${data.length}</b><span>次投递</span></div><div class="stat"><b>${passed}</b><span>初筛通过</span></div><div class="stat"><b>${ivs}</b><span>场面试</span></div>` : '';
  $('bar').style.display = data.length ? '' : 'none';
}
function render() { renderStats(); renderSeg(); renderList(); }
render();

/* 「分析中」那条过几秒出结果：真实页面在有进行中的投递时每隔几秒刷新一次列表 */
setTimeout(() => {
  const a = APPLIES[0]; if (a.status !== 'running') return;
  Object.assign(a, { status: 'success', score: 68, passed: true }); if (data === APPLIES) render();
}, 5000);

/* 右下角：有记录 / 空状态 */
document.querySelectorAll('.demo-flag button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.demo-flag button').forEach(x => x.classList.toggle('on', x === b));
  data = b.dataset.variant === 'some' ? APPLIES : []; filter = 'all'; render();
}));
</script>
</body>
</html>
