<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改密码 · 求职辅助</title>
<style>
  /* 色板同 index.css 开头（三套配色） */
  :root, :root[data-pal="linkedin"] {
    --bg: #f4f2ee; --bg-2: #e9e5df; --paper: #fff; --field: #fff; --ink: #191919; --ink-rgb: 25,25,25; --ink-2: #4d4d4d; --ink-3: #626262;
    --accent: #0a66c2; --accent-rgb: 10,102,194; --accent-ink: #004182; --good: #057642; --good-rgb: 5,118,66; --bad: #cc1016; --bad-rgb: 204,16,22;
    --line: rgba(25,25,25,.1); --sh-rgb: 0,0,0; --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.56,.64,1);
  }
  :root[data-pal="red"] { --bg: #fbfaf8; --bg-2: #f0eeea; --paper: #fff; --field: #fff; --ink: #141414; --ink-rgb: 20,20,20; --ink-2: #4d4d4d; --ink-3: #6b6b6b;
    --accent: #c8341f; --accent-rgb: 200,52,31; --accent-ink: #a3291a; --good: #1b7350; --good-rgb: 27,115,80; --bad: #c42f22; --bad-rgb: 196,47,34; --line: rgba(20,20,20,.1); --sh-rgb: 20,20,20; }
  :root[data-pal="green"] { --bg: #f2f0e9; --bg-2: #e6e3d7; --paper: #fbfaf5; --field: #fff; --ink: #1b231f; --ink-rgb: 27,35,31; --ink-2: #4a524c; --ink-3: #5a625c;
    --accent: #2d5e4c; --accent-rgb: 45,94,76; --accent-ink: #22493b; --good: #25628a; --good-rgb: 37,98,138; --bad: #b33f2c; --bad-rgb: 179,63,44; --line: rgba(27,35,31,.1); --sh-rgb: 35,45,35; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }

  /* 导航（照抄 Nav；右上角「配色」+ 头像按钮，原来的「退出」收进头像菜单） */
  nav { border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 72px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; white-space: nowrap; }
  .logo i { width: 30px; height: 30px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-style: normal; font-size: 15px; }
  .links { display: flex; gap: 4px; }
  .links a { padding: 8px 14px; border-radius: 999px; font-size: 15px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  .links a.on { color: var(--ink); font-weight: 600; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .pal { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: none; border-radius: 999px; background: none; font-size: 14px; color: var(--ink-2); }
  .pal i { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--line); }

  /* ══ 新：头像按钮 + 菜单 ══ */
  .me { position: relative; }
  .me-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 4px; border: none; border-radius: 999px; background: none; font-size: 14px; color: var(--ink-2); transition: background .2s; }
  .me-btn:hover, .me.open .me-btn { background: rgba(var(--ink-rgb),.06); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .me-btn .caret { width: 10px; height: 10px; transition: transform .3s var(--spring); }
  .me.open .me-btn .caret { transform: rotate(180deg); }
  .me-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 220px; padding: 6px; border-radius: 16px; background: var(--paper);
    box-shadow: 0 18px 40px rgba(var(--sh-rgb),.18), inset 0 0 0 1px var(--line); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events: none;
    transition: opacity .2s, transform .3s var(--spring); }
  .me.open .me-menu { opacity: 1; transform: none; pointer-events: auto; }
  .me-who { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .me-who b { display: block; font-size: 15px; }
  .me-who span { font-size: 12px; color: var(--ink-3); }
  .me-menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border: none; border-radius: 10px; background: none; font-size: 14px; text-align: left; }
  .me-menu button:hover { background: var(--bg); }
  .me-menu svg { flex: none; color: var(--ink-3); }

  /* ══ 新：修改密码弹窗（照抄登录弹窗的面板） ══ */
  .veil { position: fixed; inset: 0; z-index: 40; background: rgba(var(--ink-rgb),.26); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  .panel { position: fixed; left: 50%; top: 50%; z-index: 41; width: min(420px, calc(100% - 32px)); padding: 26px 28px 28px; border-radius: 28px; background: var(--paper);
    box-shadow: 0 40px 80px -30px rgba(var(--sh-rgb),.45), 0 0 0 1px var(--line); transform: translate(-50%, -46%) scale(.96); opacity: 0; pointer-events: none; transition: transform .45s var(--spring), opacity .25s; }
  .panel.open { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .panel-head h2 { margin: 0; font-size: 24px; font-weight: 800; }
  .x { width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(var(--ink-rgb),.07); display: grid; place-items: center; }
  .panel .sub { margin: 0 0 18px; font-size: 14px; color: var(--ink-3); }
  .field { position: relative; margin-bottom: 12px; }
  .field input { display: block; width: 100%; height: 56px; padding: 22px 14px 6px; border: none; outline: none; border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 15px; }
  .field input:focus { box-shadow: inset 0 0 0 2px var(--ink); }
  .field.bad input { box-shadow: inset 0 0 0 2px var(--bad); }
  .field label { position: absolute; left: 15px; top: 18px; font-size: 15px; color: var(--ink-3); pointer-events: none; transition: transform .25s var(--ease), font-size .25s; transform-origin: left top; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { transform: translateY(-10px); font-size: 12px; color: var(--ink-2); }
  .hint { margin: -4px 2px 12px; font-size: 12px; color: var(--ink-3); }
  .err { margin: 2px 2px 12px; font-size: 13px; color: var(--bad); }
  .btn { height: 52px; width: 100%; border: none; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 700; }
  .btn:disabled { opacity: .4; cursor: default; }
  .done { display: grid; justify-items: center; gap: 10px; padding: 18px 0 6px; text-align: center; }
  .done .ok { width: 56px; height: 56px; border-radius: 50%; background: rgba(var(--good-rgb),.12); color: var(--good); display: grid; place-items: center; font-size: 28px; font-weight: 800; }
  .done b { font-size: 18px; }
  .done p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--ink-3); }
  .done .btn { margin-top: 10px; }

  .page { padding: 40px 0; }
  .label { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--ink-3); }
  .label b { padding: 2px 8px; margin-right: 8px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  .demo-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .demo-btns button { height: 34px; padding: 0 14px; border: none; border-radius: 999px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); font-size: 13px; }
  .notes { margin: 0; padding: 0 0 60px 20px; font-size: 14px; line-height: 1.9; color: var(--ink-2); max-width: 900px; }
  @media (max-width: 760px) { .me-btn .name, .me-btn .caret, .pal span { display: none; } .me-btn { padding: 0 4px; } }
  @media (max-width: 420px) { .wrap { padding: 0 16px; } .logo { font-size: 0; gap: 0; } .links a { padding: 8px 6px; font-size: 13px; } .links { gap: 0; } .panel { padding: 22px 20px 24px; } }
</style>
</head>
<body>
<nav><div class="wrap">
  <div class="logo"><i>求</i>求职辅助</div>
  <div class="links"><a href="#" class="on">新的投递</a><a href="#">我的投递</a><a href="#">我的简历</a></div>
  <div class="actions">
    <button class="pal" id="pal" title="换配色"><i></i><span>配色</span></button>
    <div class="me" id="me">
      <button class="me-btn" id="me-btn" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar">U</span><span class="name">user</span>
        <svg class="caret" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4l3 3 3-3"/></svg>
      </button>
      <div class="me-menu" role="menu">
        <div class="me-who"><b>user</b><span>已登录</span></div>
        <button role="menuitem" id="open-pw">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>修改密码
        </button>
        <button role="menuitem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>退出登录
        </button>
      </div>
    </div>
  </div>
</div></nav>

<main class="wrap page">
  <p class="label"><b>试一下</b>点右上角头像打开菜单；或者直接看弹窗的几种状态</p>
  <div class="demo-btns">
    <button data-show="form">弹窗：空表单</button><button data-show="wrong">弹窗：当前密码不对</button><button data-show="mismatch">弹窗：两次不一样</button><button data-show="done">弹窗：改好了</button>
  </div>
  <ul class="notes">
    <li>右上角的头像变成按钮：点开菜单，第一行是用户名，下面「修改密码」「退出登录」。原来单独的「退出」收进菜单里（手机上导航更宽松：只放一个头像，不再隐藏）。</li>
    <li>弹窗：当前密码、新密码（6–64 位，和注册一样）、再输一次。两次不一样当场提示；当前密码不对由后端说；保存成功显示「密码已修改」，当前这台设备保持登录。</li>
    <li>点遮罩、Esc、右上角 × 都能关；关掉再打开表单是空的。</li>
  </ul>
</main>

<div class="veil" id="veil"></div>
<form class="panel" id="panel" onsubmit="return false" role="dialog" aria-modal="true" aria-labelledby="pw-title">
  <div class="panel-head"><h2 id="pw-title">修改密码</h2>
    <button type="button" class="x" id="close" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  </div>
  <div id="body"></div>
</form>

<script>
const body = document.getElementById('body')
function show(state) {
  document.getElementById('veil').classList.add('open'); document.getElementById('panel').classList.add('open')
  if (state === 'done') {
    body.innerHTML = `<div class="done"><span class="ok">✓</span><b>密码已修改</b><p>下次登录用新密码。<br>这台设备不用重新登录。</p><button type="button" class="btn" id="fin">好的</button></div>`
    return
  }
  const bad = (k) => (state === k ? ' bad' : '')
  body.innerHTML = `<p class="sub">账号 user</p>
    <div class="field${bad('wrong')}"><input type="password" placeholder=" " id="p0" ${state !== 'form' ? 'value="12345678"' : ''}><label for="p0">当前密码</label></div>
    ${state === 'wrong' ? '<p class="err">当前密码不对</p>' : ''}
    <div class="field"><input type="password" placeholder=" " id="p1" ${state !== 'form' ? 'value="abcdefgh"' : ''}><label for="p1">新密码</label></div>
    <p class="hint">6–64 位</p>
    <div class="field${bad('mismatch')}"><input type="password" placeholder=" " id="p2" ${state === 'mismatch' ? 'value="abcdefgx"' : state === 'wrong' ? 'value="abcdefgh"' : ''}><label for="p2">再输一次新密码</label></div>
    ${state === 'mismatch' ? '<p class="err">两次输入的新密码不一样</p>' : ''}
    <button type="submit" class="btn" id="save">保存</button>`
}
function hide() { document.getElementById('veil').classList.remove('open'); document.getElementById('panel').classList.remove('open') }
document.addEventListener('click', (e) => {
  const me = document.getElementById('me')
  if (e.target.closest('#me-btn')) { me.classList.toggle('open'); return }
  if (!e.target.closest('.me-menu')) me.classList.remove('open')
  if (e.target.closest('#open-pw')) { me.classList.remove('open'); show('form'); return }
  const t = e.target.closest('[data-show]'); if (t) return show(t.dataset.show)
  if (e.target.closest('#close') || e.target.id === 'veil' || e.target.id === 'fin') hide()
  if (e.target.id === 'save') {
    const v = (id) => document.getElementById(id).value
    if (v('p1') !== v('p2')) return show('mismatch')
    show('done')
  }
  if (e.target.closest('#pal')) { const order = ['linkedin', 'red', 'green']; const cur = document.documentElement.dataset.pal || 'linkedin'; document.documentElement.dataset.pal = order[(order.indexOf(cur) + 1) % 3] }
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hide(); document.getElementById('me').classList.remove('open') } })
</script>
</body>
</html>
