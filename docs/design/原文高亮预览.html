<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原文高亮 · 求职辅助</title>
<style>
  :root {
    --cream: #f6f0e6; --cream-2: #efe6d7; --paper: #fffaf2;
    --ink: #221d17; --ink-2: #6b6157; --ink-3: #8a7f73;
    --line: rgba(34,29,23,.1);
    --accent: #d9542b; --accent-ink: #b8431f;
    --good: #2f7d4f; --warn: #b7791f; --bad: #c2362b;
    --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); overflow-x: hidden;
    font-family: "PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif; -webkit-font-smoothing: antialiased; }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  ::selection { background: rgba(217,84,43,.2); }
  .grain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35; background-image: radial-gradient(rgba(34,29,23,.08) 1px, transparent 1px); background-size: 22px 22px; }
  .glow { position: fixed; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, rgba(242,140,90,.28) 0%, rgba(242,140,90,0) 65%); }
  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 32px; }

  /* ── 导航、按钮、左侧大标题：同工作台 ── */
  nav { position: sticky; top: 0; z-index: 20; padding: 18px 0; }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .5px; }
  .logo-mark { width: 30px; height: 30px; border-radius: 10px; background: var(--ink); color: var(--cream); display: grid; place-items: center; font-size: 15px; }
  .links a { padding: 8px 14px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 15px; }
  .me { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .top-progress { position: relative; z-index: 1; height: 3px; background: var(--accent); }
  .btn { position: relative; height: 44px; padding: 0 22px; border-radius: 999px; border: none; font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .35s var(--spring), background .2s, box-shadow .3s; }
  .btn.ghost { background: transparent; height: 36px; padding: 0 14px; font-size: 14px; }
  .btn.outline { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.lg { height: 56px; padding: 0 30px; font-size: 17px; }
  .btn.soon { background: var(--cream-2); color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--line); cursor: default; }
  .btn.soon small { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--paper); color: var(--ink-2); }
  .btn:active { transform: scale(.96); }

  .screen { display: grid; grid-template-columns: 1fr 1.05fr; gap: 64px; align-items: center; min-height: calc(100vh - 83px); padding: 40px 0 80px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); font-size: 13px; color: var(--ink-2); }
  .tag b { padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--cream); font-weight: 600; font-size: 12px; }
  h1 { margin: 22px 0 20px; font-size: clamp(40px, 5vw, 64px); line-height: 1.14; letter-spacing: -1px; font-weight: 800; }
  h1 .line { display: block; overflow: hidden; padding-bottom: 6px; }
  h1 .line > span { display: inline-block; transform: translateY(110%); animation: rise .9s var(--ease) forwards; }
  h1 .line:nth-child(2) > span { animation-delay: .1s; }
  .mark { position: relative; white-space: nowrap; }
  .mark svg { position: absolute; left: -4%; bottom: -8px; width: 108%; height: 20px; overflow: visible; }
  .mark path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1s .7s var(--ease) forwards; }
  .sub { margin: 0 0 24px; max-width: 460px; font-size: 18px; line-height: 1.7; color: var(--ink-2); }
  .cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .fade { opacity: 0; transform: translateY(18px); animation: fadeUp .8s var(--ease) forwards; }
  .d1 { animation-delay: .25s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .7s; }
  @keyframes rise { to { transform: none; } }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { opacity: 1; transform: none; } }

  .score-hero { display: flex; align-items: center; gap: 22px; margin: 0 0 26px; }
  .ring { position: relative; width: 120px; height: 120px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .t { stroke: var(--cream-2); }
  .ring .b { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 314.2; stroke-dashoffset: 314.2; transition: stroke-dashoffset 1.4s var(--ease); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dims { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; flex: 1; max-width: 300px; }
  .dim .l { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .dim .l b { color: var(--ink); }
  .dim .tk { height: 5px; border-radius: 5px; background: var(--cream-2); overflow: hidden; }
  .dim .tk i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 1.2s var(--ease); }

  /* ── 右侧问题卡：同工作台，展开后多一个「在原文中查看」 ── */
  .stage { position: relative; perspective: 1200px; }
  .card { position: relative; background: var(--paper); border-radius: 28px; padding: 24px;
    box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 30px 60px -20px rgba(80,50,20,.25), 0 0 0 1px var(--line); }
  .floaty { position: absolute; z-index: 3; left: -54px; top: -26px; padding: 10px 14px; border-radius: 14px; background: var(--paper); box-shadow: 0 16px 36px -12px rgba(80,50,20,.3), 0 0 0 1px var(--line); font-size: 13px; animation: bob 5s ease-in-out infinite; }
  .floaty b { display: block; font-size: 17px; } .floaty span { color: var(--ink-3); }
  @keyframes bob { 50% { translate: 0 -10px; } }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .tabs { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 999px; background: var(--cream-2); }
  .tabs .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n)); border-radius: 999px; background: var(--paper); box-shadow: 0 2px 8px rgba(80,50,20,.12); transform: translateX(calc(var(--i) * 100%)); transition: transform .45s var(--spring); }
  .tabs button { position: relative; z-index: 1; height: 32px; padding: 0 14px; border: none; background: none; font-weight: 600; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .tabs button.on { color: var(--ink); }
  .link { background: none; border: none; padding: 0; color: var(--accent-ink); font-size: 13px; font-weight: 600; }
  .link:hover { text-decoration: underline; }
  .issues { max-height: 470px; overflow: auto; margin: -2px; padding: 2px; }
  .issue { border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 8px; opacity: 0; transform: translateY(8px); animation: pop .5s var(--spring) forwards; transition: box-shadow .25s; }
  .issue:hover, .issue.open { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .issue-row { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 12px 14px; border: none; background: none; text-align: left; font-size: 14px; }
  .issue-text { display: flex; flex-direction: column; min-width: 0; }
  .issue .why { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .tagx { flex: none; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .tagx.miss { background: rgba(194,54,43,.12); color: var(--bad); }
  .tagx.part { background: rgba(183,121,31,.15); color: var(--warn); }
  .tagx.high { background: var(--bad); color: #fff; }
  .tagx.med { background: var(--warn); color: #fff; }
  .tagx.low { background: rgba(34,29,23,.08); color: var(--ink-2); }
  .tagx.hit { background: rgba(47,125,79,.14); color: var(--good); }
  .issue-arrow { margin-left: auto; color: var(--ink-3); font-size: 18px; line-height: 20px; transition: transform .35s var(--spring); }
  .issue.open .issue-arrow { transform: rotate(90deg); color: var(--ink); }
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
  .detail > div { overflow: hidden; }
  .issue.open .detail { grid-template-rows: 1fr; }
  .detail-in { padding: 0 14px 14px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .detail-in p { display: flex; gap: 10px; margin: 6px 0 0; }
  .detail-in .k { flex: none; width: 56px; font-size: 12px; color: var(--ink-3); }
  .detail-in .q { padding: 8px 10px; border-radius: 10px; background: var(--cream); color: var(--ink); }
  .to-paper { margin-top: 10px; height: 32px; padding: 0 14px; border: none; border-radius: 999px; background: var(--ink); color: var(--cream); font-size: 13px; font-weight: 600; transition: transform .35s var(--spring), background .2s; }
  .to-paper:hover { background: #000; transform: translateX(3px); }

  /* ── 原文纸面：从右侧滑出 ── */
  .veil { position: fixed; inset: 0; z-index: 40; background: rgba(34,29,23,.26); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 41; top: 12px; right: 12px; bottom: 12px; width: min(640px, calc(100vw - 24px)); display: flex; flex-direction: column;
    border-radius: 28px; background: var(--paper); box-shadow: 0 30px 80px -20px rgba(40,25,10,.45), 0 0 0 1px var(--line);
    transform: translateX(calc(100% + 24px)); transition: transform .55s var(--ease); }
  .sheet.open { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px 24px; }
  .sheet-title { font-size: 18px; font-weight: 800; }
  .sheet-title span { margin-left: 8px; font-size: 13px; font-weight: 400; color: var(--ink-3); }
  .x { width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(34,29,23,.07); display: grid; place-items: center; transition: transform .4s var(--spring), background .2s; }
  .x:hover { transform: rotate(90deg); background: rgba(34,29,23,.12); }

  /* 当前这条：说明 + 上一条 / 下一条 */
  .focus-card { margin: 0 16px; padding: 14px 16px; border-radius: 18px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); max-height: 52vh; overflow: auto; }

  /* 针对这一句 / 这条要求的具体建议：点开才生成，边生成边显示 */
  .advice { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(180deg, #fff6ee, #fffdfa); box-shadow: inset 0 0 0 1.5px rgba(217,84,43,.2); }
  .advice-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; font-size: 12px; font-weight: 700; color: var(--accent-ink); }
  .advice-head span { font-weight: 400; color: var(--ink-3); }
  .advice p { display: flex; gap: 10px; margin: 7px 0 0; font-size: 13px; line-height: 1.75; color: var(--ink); }
  .advice .k { flex: none; width: 64px; padding-top: 1px; font-size: 12px; color: var(--ink-3); }
  .advice .rewrite { font-weight: 600; }
  .advice .thinking { color: var(--ink-3); }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .ph { padding: 0 3px; border-radius: 4px; background: rgba(217,84,43,.13); color: var(--accent-ink); font-weight: 600; }
  .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .copy { margin-left: 8px; padding: 0; border: none; background: none; font-size: 12px; font-weight: 600; color: var(--accent-ink); }
  .copy:hover { text-decoration: underline; }
  .advice-foot { margin-top: 8px; font-size: 11px; color: var(--ink-3); }
  .fc-top { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; }
  .fc-top .why { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--ink-3); }
  .fc-fix { margin: 8px 0 0; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .fc-fix b { font-weight: 600; color: var(--ink); margin-right: 6px; }
  .fc-missing { margin: 10px 0 0; padding: 8px 12px; border-radius: 12px; border: 1.5px dashed rgba(194,54,43,.35); font-size: 13px; color: var(--bad); }
  .fc-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-3); }
  .fc-nav button { height: 30px; padding: 0 12px; border: none; border-radius: 999px; background: var(--cream-2); font-size: 13px; font-weight: 600; color: var(--ink); transition: background .2s; }
  .fc-nav button:hover:not(:disabled) { background: #e6dccb; }
  .fc-nav button:disabled { opacity: .4; cursor: default; }
  .fc-in { animation: fcIn .45s var(--ease); }
  @keyframes fcIn { from { opacity: 0; transform: translateY(6px); } }

  /* 纸面 */
  .paper-wrap { position: relative; flex: 1; overflow: auto; margin: 12px 16px 0; padding: 30px 34px 60px; border-radius: 18px 18px 0 0; background: #fff; box-shadow: inset 0 0 0 1px var(--line); scroll-behavior: smooth; }
  .paper .name { margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: 1px; }
  .paper .contact { margin: 0 0 6px; font-size: 13px; color: var(--ink-3); }
  .paper h4 { margin: 20px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--ink-3); }
  .paper p { margin: 0 0 5px; font-size: 14px; line-height: 1.9; }
  .paper p.entry { margin-top: 10px; font-weight: 700; }
  .hl { border-radius: 3px; cursor: pointer; transition: background .3s, box-shadow .3s; }
  .hl.good { background: rgba(47,125,79,.09); box-shadow: 0 2px 0 rgba(47,125,79,.45); }
  .hl.part { background: rgba(183,121,31,.13); box-shadow: 0 2px 0 var(--warn); }
  .hl.bad { background: rgba(194,54,43,.11); box-shadow: 0 2px 0 var(--bad); }
  .hl:hover { background: rgba(217,84,43,.16); }
  .hl.focus { position: relative; background: rgba(217,84,43,.2); box-shadow: 0 0 0 2px var(--accent); animation: flash 1.2s var(--ease); }
  @keyframes flash { 0% { box-shadow: 0 0 0 8px rgba(217,84,43,.35); } 100% { box-shadow: 0 0 0 2px var(--accent); } }
  .note { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 2; width: max-content; max-width: 260px; padding: 5px 10px; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; line-height: 1.5; white-space: normal; pointer-events: none;
    animation: noteIn .45s var(--spring), noteOut .5s 2.6s forwards; }   /* 弹出后几秒淡出，别一直挡住上一行的字 */
  .note::after { content: ""; position: absolute; left: 12px; top: 100%; border: 5px solid transparent; border-top-color: var(--accent); }
  @keyframes noteIn { from { opacity: 0; transform: translateY(6px) scale(.9); } }
  @keyframes noteOut { to { opacity: 0; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 24px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
  .legend i { display: inline-block; width: 18px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
  .legend .bad { background: rgba(194,54,43,.11); box-shadow: 0 2px 0 var(--bad); }
  .legend .part { background: rgba(183,121,31,.13); box-shadow: 0 2px 0 var(--warn); }
  .legend .good { background: rgba(47,125,79,.09); box-shadow: 0 2px 0 rgba(47,125,79,.45); }
  .legend .keys { margin-left: auto; }

  .demo-flag { position: fixed; left: 16px; bottom: 16px; z-index: 30; font-size: 12px; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--cream); }

  @media (max-width: 960px) {
    .screen { grid-template-columns: 1fr; gap: 40px; } .links { display: none; } .wrap { padding: 0 16px; } .floaty { display: none; }
    .score-hero { flex-wrap: wrap; } .legend .keys { display: none; }
  }
  @media (max-width: 640px) {
    .sheet { top: 0; right: 0; bottom: 0; width: 100vw; border-radius: 0; }
    .paper-wrap { padding: 22px 18px 60px; margin: 12px 10px 0; }
    .focus-card { margin: 0 10px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; } .glow { display: none; } }
</style>
</head>
<body>
<div class="grain"></div><div class="glow" id="glow"></div>
<nav>
  <div class="wrap">
    <div class="logo"><span class="logo-mark">求</span>求职辅助</div>
    <div class="links"><a href="#">新的投递</a></div>
    <div class="me"><span class="avatar">U</span>user<button class="btn ghost">退出</button></div>
  </div>
</nav>
<div class="top-progress"></div>
<main class="wrap"><section class="screen" id="result"></section></main>

<!-- 原文纸面 -->
<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle">简历原文<span id="sheetFile"></span></div>
    <button class="x" id="close" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  </div>
  <div class="focus-card" id="focus"></div>
  <div class="paper-wrap" id="paperWrap"><div class="paper" id="paper"></div></div>
  <div class="legend">
    <span><i class="bad"></i>简历问题</span><span><i class="part"></i>部分满足的要求</span><span><i class="good"></i>满足的要求</span>
    <span class="keys">← → 切换 · Esc 关闭</span>
  </div>
</aside>

<script>

/* ── 具体建议：点开一条才生成，一个字一个字打出来；生成过的再打开直接显示。
   演示里的文字是用真实数据调 DeepSeek 生成的，这里按真实速度（首字约 0.7 秒）回放 ── */
const ADV = {};   // key → { shown: 已显示的字数, done }
const SECTION = /【(问题|改成|为什么|考察什么|怎么补|面试怎么答)】/;

/** 把【…】标成待填的占位（可以嵌套，只包最外层）；还没写完的半个占位先按普通文字显示 */
function placeholders(s) {
  let out = '', buf = '', depth = 0;
  for (const ch of s) {
    if (ch === '【') { if (depth === 0) { out += esc(buf); buf = ''; } depth++; buf += ch; continue; }
    buf += ch;
    if (ch === '】' && depth > 0 && --depth === 0) { out += `<span class="ph">${esc(buf)}</span>`; buf = ''; }
  }
  return out + esc(buf);
}

function adviceHtml(key) {
  const x = BY_KEY[key], st = ADV[key];
  const head = `<div class="advice-head">针对这${x.list === 'gap' ? '条要求' : '一句'}的建议<span>DeepSeek 生成</span></div>`;
  if (!st || !st.shown) return head + `<p class="thinking">正在针对这${x.list === 'gap' ? '条要求' : '一句'}写建议<span class="dots"></span></p>`;
  // 流到一半时，末尾可能是半个段标题（如「【改」），先不显示
  const text = st.done ? x.advice : x.advice.slice(0, st.shown).replace(/【[^】]{0,5}$/, '');
  const parts = text.split(new RegExp(SECTION.source, 'g'));   // ['', '问题', '……', '改成', '……', …]
  let rows = '';
  for (let i = 1; i < parts.length; i += 2) {
    const k = parts[i], v = (parts[i + 1] || '').trim(), last = i + 2 >= parts.length;
    const copy = k === '改成' && st.done ? `<button class="copy" data-copy="${key}">复制</button>` : '';
    rows += `<p><span class="k">${k}</span><span class="${k === '改成' ? 'rewrite' : ''}">${placeholders(v)}${last && !st.done ? '<i class="caret"></i>' : ''}${copy}</span></p>`;
  }
  const foot = x.list === 'gap' ? '「如果你做过」的写法，只在确实做过时再用；【】里按实际填写' : '【】里的内容按你的实际情况填写，别照抄';
  return head + rows + (st.done ? `<div class="advice-foot">${foot}</div>` : '');
}

function paintAdvice(key) { document.querySelectorAll(`[data-advice="${key}"]`).forEach(el => { el.innerHTML = adviceHtml(key); }); }

function startAdvice(key) {
  const x = BY_KEY[key];
  if (!x.advice) return;
  if (ADV[key]) return paintAdvice(key);          // 生成过或正在生成：照当前进度显示
  const st = ADV[key] = { shown: 0, done: false };
  paintAdvice(key);
  setTimeout(function tick() {
    st.shown += 2 + Math.floor(Math.random() * 2);
    st.done = st.shown >= x.advice.length;
    paintAdvice(key);
    if (!st.done) setTimeout(tick, 28);
  }, 700);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const rewrite = (BY_KEY[b.dataset.copy].advice.match(/【改成】([\s\S]*?)(?=【(?:为什么|问题)】|$)/) || [])[1] || '';
  try { await navigator.clipboard.writeText(rewrite.trim()); b.textContent = '已复制'; } catch { b.textContent = '复制失败，请手动选中'; }
});

function renderResult() {
  const o = Math.round(DATA.overall);
  const dims = [['skill', '技能'], ['education', '学历'], ['experience', '经验'], ['other', '其他']]
    .filter(([k]) => DATA.dims[k] !== null).map(([k, l]) => `<div class="dim"><div class="l">${l}<b>${Math.round(DATA.dims[k])}</b></div><div class="tk"><i data-w="${DATA.dims[k]}"></i></div></div>`).join('');
  $('result').innerHTML = `
    <div>
      <span class="tag fade d1"><b>初筛结果</b>${esc(DATA.job_title)}</span>
      <h1><span class="line"><span>通过初筛，</span></span><span class="line"><span>可以去<span class="mark">面试${MARK_SVG}</span>了。</span></span></h1>
      <p class="sub fade d2">匹配度 ${o}，过了 ${DATA.threshold} 分的初筛线。下面还有几处可以写得更好，面试前值得先改。</p>
      <div class="score-hero fade d2">
        <div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="50"/><circle class="b" id="ringBar" cx="60" cy="60" r="50"/></svg><div class="num" id="num">0</div></div>
        <div class="dims">${dims}</div>
      </div>
      <div class="cta fade d3"><button class="btn soon lg">进入模拟面试 <small>即将开放</small></button><button class="btn outline lg">再投一个</button></div>
    </div>
    <div class="stage fade d4">
      <div class="floaty"><b>${o} / ${DATA.threshold}</b><span>匹配度 / 初筛线</span></div>
      <div class="card">
        <div class="card-head">
          <div class="tabs" id="tabs" style="--n:2;--i:0"><span class="knob"></span><button class="on" data-tab="gap">对照岗位 · ${LISTS.gap.length}</button><button data-tab="self">简历本身 · ${LISTS.self.length}</button></div>
          <button class="link" data-open="">查看简历原文 →</button>
        </div>
        <div class="issues" id="issues"></div>
      </div>
    </div>`;
  renderList();
  setTimeout(() => {
    $('ringBar').style.strokeDashoffset = 314.2 * (1 - o / 100);
    document.querySelectorAll('.dim .tk i').forEach(i => i.style.width = i.dataset.w + '%');
    const t0 = performance.now();
    (function tick(t) { const k = Math.min(1, (t - t0) / 1400); $('num').textContent = Math.round(o * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); })(t0);
  }, 500);
}
function renderList() { $('issues').innerHTML = LISTS[tab].map(issueHtml).join(''); }

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('#tabs button');
  if (tabBtn) {
    tab = tabBtn.dataset.tab;
    document.querySelectorAll('#tabs button').forEach((b, i) => { b.classList.toggle('on', b === tabBtn); if (b === tabBtn) $('tabs').style.setProperty('--i', i); });
    return renderList();
  }
  const open = e.target.closest('[data-open]');
  if (open) return openSheet(open.dataset.open || null);
  const row = e.target.closest('.issue-row');
  if (row && row.parentElement.classList.toggle('open')) startAdvice(row.parentElement.dataset.key);   // 展开 = 开始生成
});

/* ── 纸面：按块渲染原文，高亮按字符区间切段（一段可以同时属于好几条标注） ── */
function renderPaper() {
  const ft = DATA.full_text;
  const marks = Object.values(BY_KEY).filter(x => x.color && located(x));
  const heading = new Set(DATA.sections.filter(s => s.matched_by !== 'implicit').map(s => s.block_start));
  const basics = DATA.sections.find(s => s.type === 'basics');
  const entryStarts = new Set(DATA.entry_blocks);
  const html = DATA.blocks.map(b => {
    const cuts = new Set([b.s, b.e]);
    marks.forEach(m => { if (m.start < b.e && m.end > b.s) { cuts.add(Math.max(m.start, b.s)); cuts.add(Math.min(m.end, b.e)); } });
    const points = [...cuts].sort((a, c) => a - c);
    let inner = '';
    for (let i = 0; i < points.length - 1; i++) {
      const [a, z] = [points[i], points[i + 1]];
      const cover = marks.filter(m => m.start < z && m.end > a);
      const text = esc(ft.slice(a, z));
      if (!cover.length) { inner += text; continue; }
      const top = cover.reduce((p, m) => (PRIORITY[m.color] > PRIORITY[p.color] ? m : p));
      inner += `<span class="hl ${top.color}" data-keys="${cover.map(m => m.key).join(' ')}" title="${esc(cover.map(m => m.note).join('\n'))}">${text}</span>`;
    }
    if (heading.has(b.i)) return `<h4>${inner}</h4>`;
    if (basics && b.i === basics.block_start) return `<p class="name">${inner}</p>`;
    if (basics && b.i <= basics.block_end) return `<p class="contact">${inner}</p>`;
    return `<p${entryStarts.has(b.i) ? ' class="entry"' : ''}>${inner}</p>`;
  }).join('');
  $('paper').innerHTML = html;
}

let current = null;   // 当前聚焦的条目

function openSheet(key) {
  $('sheet').classList.add('open'); $('veil').classList.add('open'); $('sheet').setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  focusOn(key ? BY_KEY[key] : null);
}
function closeSheet() {
  $('sheet').classList.remove('open'); $('veil').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
}

function focusOn(item) {
  current = item;
  document.querySelectorAll('.hl.focus').forEach(s => s.classList.remove('focus'));
  document.querySelectorAll('.note').forEach(n => n.remove());

  if (!item) {
    const n = (l) => LISTS[l].filter(located).length;
    $('focus').innerHTML = `<div class="fc-in"><div class="fc-top"><span>全部标注</span></div>
      <p class="fc-fix">红色是简历本身的问题（${n('self')} 处），橙色是部分满足的岗位要求（${n('gap')} 处），绿色是已经满足的要求（${n('hit')} 条）。点任意一处看说明。</p>
      <div class="fc-nav"><span>${esc(DATA.resume_title)}</span><button data-go="first">从第一条问题开始 →</button></div></div>`;
    $('paperWrap').scrollTop = 0;
    return;
  }

  const list = LISTS[item.list], idx = list.indexOf(item);
  const missing = !located(item)
    ? `<p class="fc-missing">${item.list === 'gap' ? '简历里没有找到能证明这条要求的内容 —— 这正是需要补上的地方。' : '这条针对整份简历，没有具体的某一句。'}</p>` : '';
  $('focus').innerHTML = `<div class="fc-in">
    <div class="fc-top"><span class="tagx ${item.tag[0]}">${item.tag[1]}</span><span>${esc(item.text)}<span class="why">${esc(item.why)}</span></span></div>
    ${item.fix ? `<p class="fc-fix"><b>${item.fix[0]}</b>${esc(item.fix[1])}</p>` : ''}
    ${missing}
    ${item.advice ? `<div class="advice" data-advice="${item.key}"></div>` : ''}
    <div class="fc-nav"><button data-go="-1" ${idx <= 0 ? 'disabled' : ''}>‹ 上一条</button><span>${LIST_NAME[item.list]} · ${idx + 1} / ${list.length}</span><button data-go="1" ${idx >= list.length - 1 ? 'disabled' : ''}>下一条 ›</button></div>
  </div>`;
  startAdvice(item.key);   // 切到这一条 = 开始生成（生成过的直接显示）

  if (!located(item)) { $('paperWrap').scrollTop = 0; return; }
  const segs = [...document.querySelectorAll('.hl')].filter(s => s.dataset.keys.split(' ').includes(item.key));
  segs.forEach(s => { s.classList.remove('focus'); void s.offsetWidth; s.classList.add('focus'); });   // 重新触发闪一下
  const first = segs[0];
  if (!first) return;
  const note = document.createElement('span');
  note.className = 'note'; note.textContent = item.note;
  first.appendChild(note);
  // 批注别超出纸面右边
  const over = note.getBoundingClientRect().right - $('paperWrap').getBoundingClientRect().right + 12;
  if (over > 0) note.style.left = `${-over}px`;
  first.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
}

function step(d) {
  if (!current) return focusOn(LISTS.self[0]);
  const list = LISTS[current.list], next = list[list.indexOf(current) + d];
  if (next) focusOn(next);
}

$('focus').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  b.dataset.go === 'first' ? focusOn(LISTS.self[0]) : step(+b.dataset.go);
});
$('paper').addEventListener('click', e => {
  const seg = e.target.closest('.hl'); if (!seg) return;
  // 一段属于好几条时：优先当前列表里的，其次问题 > 部分满足 > 满足
  const keys = seg.dataset.keys.split(' ').map(k => BY_KEY[k]);
  const pick = keys.find(x => current && x.list === current.list && x !== current)
    || keys.sort((a, b) => PRIORITY[b.color] - PRIORITY[a.color]).find(x => x !== current) || keys[0];
  focusOn(pick);
});
$('close').addEventListener('click', closeSheet);
$('veil').addEventListener('click', closeSheet);
addEventListener('keydown', e => {
  if (!$('sheet').classList.contains('open')) return;
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

$('sheetFile').textContent = DATA.resume_title;
renderResult();
renderPaper();
</script>
</body>
</html>
