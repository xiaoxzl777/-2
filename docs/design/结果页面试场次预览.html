<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面过的场次 · 求职辅助</title>
<style>
  /* ═════════ 色板：三套配色，用户在导航栏「配色」里选（正式改时对应 index.css 开头的 @theme） ═════════ */
  :root, :root[data-pal="linkedin"] {       /* 领英蓝（默认）：参考 LinkedIn，主色 #0A66C2、暖米灰底 #F4F2EE */
    --bg: #f4f2ee; --bg-rgb: 244,242,238; --bg-2: #e9e5df; --paper: #fff; --field: #fff; --sheet: #fff;
    --ink: #191919; --ink-rgb: 25,25,25; --ink-2: #4d4d4d; --ink-3: #626262; --on-ink: #f4f2ee; --line: rgba(0,0,0,.08);
    --accent: #0a66c2; --accent-rgb: 10,102,194; --accent-ink: #004182; --on-accent: #fff;
    --good: #057642; --good-rgb: 5,118,66; --warn: #8c5200; --warn-rgb: 140,82,0; --bad: #cc1016; --bad-rgb: 204,16,22; --on-solid: #fff;
    --sh-rgb: 0,0,0; --glow-rgb: 10,102,194; --glow-a: .08; --hi: rgba(255,255,255,.9);
    --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.56,.64,1);
  }
  :root[data-pal="red"] {                   /* 纯白 + 朱红：「红笔批改」 */
    --bg: #fbfaf8; --bg-rgb: 251,250,248; --bg-2: #f0eeea; --paper: #fff; --field: #fff; --sheet: #fff;
    --ink: #141414; --ink-rgb: 20,20,20; --ink-2: #4d4d4d; --ink-3: #6b6b6b; --on-ink: #fbfaf8; --line: rgba(20,20,20,.09);
    --accent: #c8341f; --accent-rgb: 200,52,31; --accent-ink: #a3291a; --on-accent: #fff;
    --good: #1b7350; --good-rgb: 27,115,80; --warn: #8c5200; --warn-rgb: 140,82,0; --bad: #c42f22; --bad-rgb: 196,47,34; --on-solid: #fff;
    --sh-rgb: 20,20,20; --glow-rgb: 200,52,31; --glow-a: .07; --hi: rgba(255,255,255,.9);
  }
  :root[data-pal="green"] {                 /* 米白 + 墨绿：沉稳。「满足 / 通过」改用蓝色，免得和主色撞 */
    --bg: #f2f0e9; --bg-rgb: 242,240,233; --bg-2: #e6e3d7; --paper: #fbfaf5; --field: #fff; --sheet: #fff;
    --ink: #1b231f; --ink-rgb: 27,35,31; --ink-2: #4a524c; --ink-3: #5a625c; --on-ink: #f2f0e9; --line: rgba(27,35,31,.1);
    --accent: #2d5e4c; --accent-rgb: 45,94,76; --accent-ink: #22493b; --on-accent: #fff;
    --good: #25628a; --good-rgb: 37,98,138; --warn: #93590a; --warn-rgb: 147,89,10; --bad: #b33f2c; --bad-rgb: 179,63,44; --on-solid: #fff;
    --sh-rgb: 35,45,35; --glow-rgb: 90,150,115; --glow-a: .16; --hi: rgba(255,255,255,.8);
  }
  html.theming *, html.theming *::before, html.theming *::after {
    transition: background-color .35s, color .35s, box-shadow .35s, stroke .35s, border-color .35s !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: hidden;
    font-family: "PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif; -webkit-font-smoothing: antialiased; }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  ::selection { background: rgba(var(--accent-rgb),.2); }
  .grain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .35; background-image: radial-gradient(rgba(var(--ink-rgb),.08) 1px, transparent 1px); background-size: 22px 22px; }
  .glow { position: fixed; left: 0; top: 0; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, rgba(var(--glow-rgb),var(--glow-a)) 0%, transparent 65%); }
  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 32px; }

  /* ── 导航、按钮：同线上 ── */
  nav { position: sticky; top: 0; z-index: 20; padding: 18px 0; transition: background .3s, box-shadow .3s; }
  nav.scrolled { background: rgba(var(--bg-rgb),.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--line); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .5px; }
  .logo-mark { width: 30px; height: 30px; border-radius: 10px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font-size: 15px; }
  .links { display: flex; gap: 4px; }
  .links a { padding: 8px 14px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-size: 15px; }
  .links a:hover { background: rgba(var(--ink-rgb),.06); color: var(--ink); }
  .me { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .top-progress { position: relative; z-index: 1; height: 3px; background: var(--accent); }
  .btn { position: relative; height: 44px; padding: 0 22px; border-radius: 999px; border: none; font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .35s var(--spring), background .2s, box-shadow .3s; will-change: transform; }
  .btn.ghost { background: transparent; height: 36px; padding: 0 14px; font-size: 14px; }
  .btn.accent { background: var(--accent); color: var(--on-accent); } .btn.accent:hover { background: var(--accent-ink); box-shadow: 0 12px 28px rgba(var(--accent-rgb),.3); }
  .btn.outline { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.lg { height: 56px; padding: 0 30px; font-size: 17px; }
  .btn .arrow { transition: transform .35s var(--spring); } .btn:hover .arrow { transform: translateX(4px); }
  .btn:active { transform: scale(.96) !important; }

  .tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); font-size: 13px; color: var(--ink-2); }
  .tag b { padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: 12px; }
  h1 { margin: 22px 0 20px; font-size: clamp(40px, 5vw, 64px); line-height: 1.14; letter-spacing: -1px; font-weight: 800; }
  h1 .line { display: block; overflow: hidden; padding-bottom: 6px; }
  h1 .line > span { display: inline-block; transform: translateY(110%); animation: rise .9s var(--ease) forwards; }
  h1 .line:nth-child(2) > span { animation-delay: .1s; }
  .mark { position: relative; white-space: nowrap; }
  .mark svg { position: absolute; left: -4%; bottom: -8px; width: 108%; height: 20px; overflow: visible; }
  .mark path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1s .7s var(--ease) forwards; }
  .sub { margin: 0 0 24px; max-width: 460px; font-size: 18px; line-height: 1.7; color: var(--ink-2); }
  .cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .fade { opacity: 0; transform: translateY(18px); animation: fadeUp .8s var(--ease) forwards; }
  .d1 { animation-delay: .25s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .55s; } .d4 { animation-delay: .7s; }
  @keyframes rise { to { transform: none; } }
  @keyframes fadeUp { to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { opacity: 1; transform: none; } }

  /* 分数环 + 四项分（两版共用，大小不同） */
  .ring { position: relative; width: 120px; height: 120px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .t { stroke: var(--bg-2); }
  .ring .b { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 314.2; stroke-dashoffset: 314.2; transition: stroke-dashoffset 1.4s var(--ease); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .dims { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; flex: 1; max-width: 300px; }
  .dim .l { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .dim .l b { color: var(--ink); }
  .dim .tk { height: 5px; border-radius: 5px; background: var(--bg-2); overflow: hidden; }
  .dim .tk i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 1.2s var(--ease); }

  /* 一条问题（两版共用） */
  .issue { border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 8px; opacity: 0; transform: translateY(8px); animation: pop .5s var(--spring) forwards; transition: box-shadow .25s; }
  .issue:hover, .issue.open { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .issue-row { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 12px 14px; border: none; background: none; text-align: left; font-size: 14px; }
  .issue-text { display: flex; flex-direction: column; min-width: 0; }
  .issue .why { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .tagx { flex: none; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .tagx.miss { background: rgba(var(--bad-rgb),.12); color: var(--bad); }
  .tagx.part { background: rgba(var(--warn-rgb),.15); color: var(--warn); }
  .tagx.high { background: var(--bad); color: var(--on-solid); }
  .tagx.med { background: var(--warn); color: var(--on-solid); }
  .tagx.low { background: rgba(var(--ink-rgb),.08); color: var(--ink-2); }
  .tagx.hit { background: rgba(var(--good-rgb),.14); color: var(--good); }
  .issue-arrow { margin-left: auto; color: var(--ink-3); font-size: 18px; line-height: 20px; transition: transform .35s var(--spring); }
  .issue.open .issue-arrow { transform: rotate(90deg); color: var(--ink); }
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
  .detail > div { overflow: hidden; }
  .issue.open .detail { grid-template-rows: 1fr; }
  .detail-in { padding: 0 14px 14px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .detail-in p { display: flex; gap: 10px; margin: 6px 0 0; }
  .detail-in .k { flex: none; width: 56px; font-size: 12px; color: var(--ink-3); }
  .detail-in .q { padding: 8px 10px; border-radius: 10px; background: var(--bg); color: var(--ink); }
  .to-paper { margin-top: 10px; height: 32px; padding: 0 14px; border: none; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-size: 13px; font-weight: 600; transition: transform .35s var(--spring), background .2s; }
  .to-paper:hover { opacity: .88; transform: translateX(3px); }

  /* 具体建议：点开才生成，边生成边显示 */
  .advice { margin-top: 10px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(180deg, rgba(var(--accent-rgb),.07), var(--field)); box-shadow: inset 0 0 0 1.5px rgba(var(--accent-rgb),.2); }
  .advice-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; font-size: 12px; font-weight: 700; color: var(--accent-ink); }
  .advice-head span { font-weight: 400; color: var(--ink-3); }
  .advice p { display: flex; gap: 10px; margin: 7px 0 0; font-size: 13px; line-height: 1.75; color: var(--ink); }
  .advice .k { flex: none; width: 64px; padding-top: 1px; font-size: 12px; color: var(--ink-3); }
  .advice .rewrite { font-weight: 600; }
  .advice .thinking { color: var(--ink-3); }
  .wdots::after { content: ""; animation: wdots 1.2s steps(4) infinite; }
  @keyframes wdots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .ph { padding: 0 3px; border-radius: 4px; background: rgba(var(--accent-rgb),.13); color: var(--accent-ink); font-weight: 600; }
  .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; background: var(--accent); vertical-align: -2px; animation: blinkc 1s steps(2) infinite; }
  @keyframes blinkc { 50% { opacity: 0; } }
  .advice-foot { margin-top: 8px; font-size: 11px; color: var(--ink-3); }

  /* 原文纸面（两版共用） */
  .paper-wrap { position: relative; overflow: auto; background: var(--sheet); box-shadow: inset 0 0 0 1px var(--line); scroll-behavior: smooth; }
  .paper .name { margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: 1px; }
  .paper .contact { margin: 0 0 6px; font-size: 13px; color: var(--ink-3); }
  .paper h4 { margin: 20px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--ink-3); }
  .paper p { margin: 0 0 5px; font-size: 14px; line-height: 1.9; }
  .paper p.entry { margin-top: 10px; font-weight: 700; }
  .hl { border-radius: 3px; cursor: pointer; transition: background .3s, box-shadow .3s; }
  .hl.good { background: rgba(var(--good-rgb),.09); box-shadow: 0 2px 0 rgba(var(--good-rgb),.45); }
  .hl.part { background: rgba(var(--warn-rgb),.13); box-shadow: 0 2px 0 var(--warn); }
  .hl.bad { background: rgba(var(--bad-rgb),.11); box-shadow: 0 2px 0 var(--bad); }
  .hl:hover, .hl.peek { background: rgba(var(--accent-rgb),.18); }
  .hl.focus { position: relative; background: rgba(var(--accent-rgb),.2); box-shadow: 0 0 0 2px var(--accent); animation: flash 1.2s var(--ease); }
  @keyframes flash { 0% { box-shadow: 0 0 0 8px rgba(var(--accent-rgb),.35); } 100% { box-shadow: 0 0 0 2px var(--accent); } }
  .note { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 2; width: max-content; max-width: 260px; padding: 5px 10px; border-radius: 8px;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; line-height: 1.5; white-space: normal; pointer-events: none;
    animation: noteIn .45s var(--spring), noteOut .5s 2.6s forwards; }
  .note::after { content: ""; position: absolute; left: 12px; top: 100%; border: 5px solid transparent; border-top-color: var(--accent); }
  @keyframes noteIn { from { opacity: 0; transform: translateY(6px) scale(.9); } }
  @keyframes noteOut { to { opacity: 0; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-3); }
  .legend i { display: inline-block; width: 18px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
  .legend .bad { background: rgba(var(--bad-rgb),.11); box-shadow: 0 2px 0 var(--bad); }
  .legend .part { background: rgba(var(--warn-rgb),.13); box-shadow: 0 2px 0 var(--warn); }
  .legend .good { background: rgba(var(--good-rgb),.09); box-shadow: 0 2px 0 rgba(var(--good-rgb),.45); }

  /* ═════════ 现在：左边大标题，右边卡片（标签页 + 卡内滚动），原文从右侧滑出 ═════════ */
  .screen { display: grid; grid-template-columns: 1fr 1.05fr; gap: 64px; align-items: center; min-height: calc(100vh - 83px); padding: 40px 0 80px; }
  .score-hero { display: flex; align-items: center; gap: 22px; margin: 0 0 26px; }
  .stage { position: relative; perspective: 1200px; }
  .card { position: relative; background: var(--paper); border-radius: 28px; padding: 24px;
    box-shadow: 0 1px 0 var(--hi) inset, 0 30px 60px -20px rgba(var(--sh-rgb),.25), 0 0 0 1px var(--line); transition: transform .6s var(--ease); }
  .floaty { position: absolute; z-index: 3; left: -54px; top: -26px; padding: 10px 14px; border-radius: 14px; background: var(--paper); box-shadow: 0 16px 36px -12px rgba(var(--sh-rgb),.3), 0 0 0 1px var(--line); font-size: 13px; animation: bob 5s ease-in-out infinite; }
  .floaty b { display: block; font-size: 17px; } .floaty span { color: var(--ink-3); }
  @keyframes bob { 50% { translate: 0 -10px; } }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .tabs { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 999px; background: var(--bg-2); }
  .tabs .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 2); border-radius: 999px; background: var(--paper); box-shadow: 0 2px 8px rgba(var(--sh-rgb),.12); transform: translateX(calc(var(--i) * 100%)); transition: transform .45s var(--spring); }
  .tabs button { position: relative; z-index: 1; height: 32px; padding: 0 14px; border: none; background: none; font-weight: 600; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .tabs button.on { color: var(--ink); }
  .link { background: none; border: none; padding: 0; color: var(--accent-ink); font-size: 13px; font-weight: 600; }
  .link:hover { text-decoration: underline; }
  .issues { max-height: 470px; overflow: auto; margin: -2px; padding: 2px; }

  .veil { position: fixed; inset: 0; z-index: 40; background: rgba(var(--ink-rgb),.26); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 41; top: 12px; right: 12px; bottom: 12px; width: min(640px, calc(100vw - 24px)); display: flex; flex-direction: column;
    border-radius: 28px; background: var(--paper); box-shadow: 0 30px 80px -20px rgba(var(--sh-rgb),.45), 0 0 0 1px var(--line);
    transform: translateX(calc(100% + 24px)); transition: transform .55s var(--ease); }
  .sheet.open { transform: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px 24px; }
  .sheet-title { font-size: 18px; font-weight: 800; }
  .sheet-title span { margin-left: 8px; font-size: 13px; font-weight: 400; color: var(--ink-3); }
  .x { width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(var(--ink-rgb),.07); display: grid; place-items: center; transition: transform .4s var(--spring); }
  .x:hover { transform: rotate(90deg); }
  .focus-card { margin: 0 16px; padding: 14px 16px; border-radius: 18px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line); max-height: 40vh; overflow: auto; }
  .fc-top { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; }
  .fc-top .why { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--ink-3); }
  .fc-missing { margin: 10px 0 0; padding: 8px 12px; border-radius: 12px; border: 1.5px dashed rgba(var(--bad-rgb),.35); font-size: 13px; color: var(--bad); }
  .sheet .paper-wrap { flex: 1; margin: 12px 16px 0; padding: 30px 34px 60px; border-radius: 18px 18px 0 0; }
  .sheet .legend { padding: 10px 24px 14px; border-top: 1px solid var(--line); }

  /* ═════════ 改后：顶部成绩单 + 左边问题清单、右边常驻原文 ═════════ */
  /* 整页一套两列网格：成绩单、问题清单、原文都落在这两列上，左右边缘对齐 */
  .rv { --cols: minmax(0, 1fr) minmax(0, 1.08fr); padding: 36px 0 90px; }
  .rv-band, .rv-body { display: grid; grid-template-columns: var(--cols); column-gap: 28px; }
  .rv-band { align-items: end; margin-bottom: 36px; }
  .rv h1 { margin: 18px 0 10px; font-size: clamp(30px, 3.4vw, 44px); letter-spacing: -.5px; }
  .rv h1 .line { display: inline-block; }
  .rv .mark svg { bottom: -6px; height: 16px; }
  .rv .mark path { stroke-width: 5; }
  .rv-sub { margin: 0 0 22px; font-size: 16px; line-height: 1.7; color: var(--ink-2); }
  .rv .btn.lg { height: 50px; padding: 0 24px; font-size: 16px; }
  .rv-score { display: flex; align-items: center; gap: 28px; padding: 22px 28px; border-radius: 20px; background: var(--paper);
    box-shadow: 0 0 0 1px var(--line), 0 24px 44px -26px rgba(var(--sh-rgb),.35); }
  .rv-score .ring { width: 96px; height: 96px; }
  .rv-score .ring .num { font-size: 30px; }
  .rv-score .dims { flex: 1; max-width: none; gap: 12px 28px; }

  /* 左右两列都先是一行同样高的标题，下面的清单和原文卡从同一高度开始 */
  .rv-list { align-self: start; }
  /* 右列不参与定行高（contain: size），行高只由左边清单决定；原文卡最高一屏、最多和清单一样高，
     所以滚到底时两边底边平齐。清单太短时原文卡至少留 480px，宁可不齐也要看得清 */
  .rv-col { contain: size; }
  .rv-sec:last-child .issue:last-child { margin-bottom: 0; }   /* 最后一条不带下间距，底边才和原文卡平齐 */
  .rv-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 28px; margin: 0 0 12px; }

  .rv-h h3 span { overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 500; color: var(--ink-3); }
  .rv-sec + .rv-sec { margin-top: 28px; }
  .rv .issue.active { box-shadow: inset 0 0 0 2px var(--accent); }
  .rv-side { position: sticky; top: 84px; display: flex; flex-direction: column; height: min(calc(100vh - 104px), 100%); min-height: 480px; }
  .rv-paper { flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: 20px; background: var(--paper);
    box-shadow: 0 0 0 1px var(--line), 0 30px 60px -28px rgba(var(--sh-rgb),.35); overflow: hidden; }
  .rv-paper .paper-wrap { flex: 1; margin: 10px; padding: 28px 30px 60px; border-radius: 14px; }
  .rv-msg { display: none; margin: 10px 10px 0; padding: 9px 14px; border-radius: 12px; border: 1.5px dashed rgba(var(--bad-rgb),.35); font-size: 13px; color: var(--bad); }
  .rv-msg.show { display: block; animation: noteIn .4s var(--spring); }
  .rv-msg.hint { border-color: var(--line); color: var(--ink-3); }

  /* 配色入口：导航栏右上角，点开选三套之一，记在浏览器里 */
  .pal { position: relative; }

  .pal-btn .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px rgba(var(--accent-rgb),.35); }
  .pal-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 248px; padding: 6px; border-radius: 16px; background: var(--paper);
    box-shadow: 0 18px 40px rgba(var(--sh-rgb),.18), 0 0 0 1px var(--line); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: top right;
    pointer-events: none; transition: opacity .2s, transform .3s var(--spring); }
  .pal.open .pal-menu { opacity: 1; transform: none; pointer-events: auto; }
  .pal-menu p { margin: 6px 10px 8px; font-size: 12px; color: var(--ink-3); }
  .pal-opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border: none; border-radius: 12px; background: none; text-align: left; font-size: 14px; font-weight: 600; color: var(--ink); }
  .pal-opt:hover { background: rgba(var(--ink-rgb),.05); }
  .pal-opt .sw { position: relative; width: 34px; height: 24px; flex: none; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .pal-opt .sw i { position: absolute; right: 5px; bottom: 5px; width: 12px; height: 12px; border-radius: 50%; }
  .pal-opt small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); }

  .pal-opt.on .ok { opacity: 1; }

  /* ═════════ 新加的：这次投递面过的场次。胶囊和「我的投递」一样：进行中的点了继续，结束的点了看报告 ═════════ */
  .rv-iv { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: start; }   /* 标签一列、胶囊一列：折行后胶囊上下对齐 */
  .rv-iv .k { font-size: 12px; font-weight: 700; line-height: 34px; letter-spacing: 1px; color: var(--ink-3); white-space: nowrap; }
  .rv-iv .pills { display: flex; flex-wrap: wrap; gap: 8px; }

  .rv-score .rv-iv { flex-basis: 100%; padding-top: 16px; border-top: 1px dashed var(--line); }   /* 放在成绩单里：分数下面隔一条虚线 */
  .rv-iv.below { margin-top: 18px; }                                                              /* 放在按钮下面 */
  .ap-pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--field);

  .ap-pill.live { box-shadow: inset 0 0 0 1.5px rgba(var(--accent-rgb), .45); }
  .ap-pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: apBlink 1.4s ease-in-out infinite; }
  @keyframes apBlink { 50% { opacity: .25; } }

  /* 样稿专用 */
  .demo-flag { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 8px; border-radius: 18px;

  .demo-flag button i { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35); }

  @media (max-width: 1000px) {

}

/* ── 纸面：按块渲染原文，高亮按字符区间切段（一段可以同时属于好几条） ── */
function paperHtml() {
  const ft = DATA.full_text;
  const marks = Object.values(BY_KEY).filter(x => x.color && located(x));
  const heading = new Set(DATA.sections.filter(s => s.matched_by !== 'implicit').map(s => s.block_start));
  const basics = DATA.sections.find(s => s.type === 'basics');
  const entryStarts = new Set(DATA.entry_blocks);
  return DATA.blocks.map(b => {
    const cuts = new Set([b.s, b.e]);
    marks.forEach(m => { if (m.start < b.e && m.end > b.s) { cuts.add(Math.max(m.start, b.s)); cuts.add(Math.min(m.end, b.e)); } });
    const points = [...cuts].sort((a, c) => a - c);
    let inner = '';
    for (let i = 0; i < points.length - 1; i++) {
      const [a, z] = [points[i], points[i + 1]];
      const cover = marks.filter(m => m.start < z && m.end > a);
      const text = esc(ft.slice(a, z));
      if (!cover.length) { inner += text; continue; }
      const top = cover.reduce((p, m) => (PRIORITY[m.color] > PRIORITY[p.color] ? m : p));
      inner += `<span class="hl ${top.color}" data-keys="${cover.map(m => m.key).join(' ')}">${text}</span>`;
    }
    if (heading.has(b.i)) return `<h4>${inner}</h4>`;
    if (basics && b.i === basics.block_start) return `<p class="name">${inner}</p>`;
    if (basics && b.i <= basics.block_end) return `<p class="contact">${inner}</p>`;
    return `<p${entryStarts.has(b.i) ? ' class="entry"' : ''}>${inner}</p>`;
  }).join('');
}

/** 在某张纸面上定位一条：闪一下、弹批注、滚到中间（只滚纸面自己，不带着整页动） */
function pointAt(wrap, item) {
  wrap.querySelectorAll('.hl.focus').forEach(s => s.classList.remove('focus'));
  wrap.querySelectorAll('.note').forEach(n => n.remove());
  if (!item || !located(item)) { wrap.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); return; }
  const segs = [...wrap.querySelectorAll('.hl')].filter(s => s.dataset.keys.split(' ').includes(item.key));
  segs.forEach(s => { void s.offsetWidth; s.classList.add('focus'); });
  const first = segs[0];
  if (!first) return;
  const note = document.createElement('span');
  note.className = 'note'; note.textContent = item.note;
  first.appendChild(note);
  const over = note.getBoundingClientRect().right - wrap.getBoundingClientRect().right + 12;
  if (over > 0) note.style.left = `${-over}px`;
  const top = first.getBoundingClientRect().top - wrap.getBoundingClientRect().top + wrap.scrollTop;
  wrap.scrollTo({ top: Math.max(0, top - wrap.clientHeight / 2), behavior: reduce ? 'auto' : 'smooth' });
}
/** 纸面上点了一段：一段属于好几条时，优先简历问题，其次部分满足，最后满足 */
const pickFromSeg = (seg) => seg.dataset.keys.split(' ').map(k => BY_KEY[k]).sort((a, b) => PRIORITY[b.color] - PRIORITY[a.color])[0];

/* ── 抽屉（「现在」的原文；「改后」窄屏时也用它） ── */
$('sheetFile').textContent = DATA.resume_title;
$('sheetWrap').firstElementChild.innerHTML = paperHtml();
function openSheet(key) {
  $('sheet').classList.add('open'); $('veil').classList.add('open'); $('sheet').setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  sheetFocus(key ? BY_KEY[key] : null);
}
function closeSheet() {
  $('sheet').classList.remove('open'); $('veil').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
}
function sheetFocus(item) {
  if (!item) {
    const n = (l) => LISTS[l].filter(located).length;
    $('focus').innerHTML = `<div class="fc-top"><span>全部标注<span class="why">红色是简历本身的问题（${n('self')} 处），黄色是部分满足的岗位要求（${n('gap')} 处），绿色是已经满足的要求（${n('hit')} 条）。点任意一处看说明。</span></span></div>`;
  } else {
    const missing = !located(item) ? `<p class="fc-missing">${item.list === 'gap' ? '简历里没有找到能证明这条要求的内容 —— 这正是需要补上的地方。' : '这条针对整份简历，没有具体的某一句。'}</p>` : '';
    $('focus').innerHTML = `<div class="fc-top"><span class="tagx ${item.tag[0]}">${item.tag[1]}</span><span>${esc(item.text)}<span class="why">${esc(item.why)}</span></span></div>${missing}${item.advice ? `<div class="advice" data-advice="${item.key}"></div>` : ''}`;
    startAdvice(item.key);
  }
  setTimeout(() => pointAt($('sheetWrap'), item), 380);
}
$('close').addEventListener('click', closeSheet);
$('veil').addEventListener('click', closeSheet);
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('sheetWrap').addEventListener('click', e => { const seg = e.target.closest('.hl'); if (seg) sheetFocus(pickFromSeg(seg)); });

/* ── 两版的页面 ── */
const MARK = (w) => `<span class="mark">${w}<svg viewBox="0 0 300 22" preserveAspectRatio="none"><path d="M4 16 C 80 4, 200 4, 296 12"/></svg></span>`;
const O = Math.round(DATA.overall);
const DIMS = [['skill', '技能'], ['education', '学历'], ['experience', '经验'], ['other', '其他']].filter(([k]) => DATA.dims[k] !== null)
  .map(([k, l]) => `<div class="dim"><div class="l">${l}<b>${Math.round(DATA.dims[k])}</b></div><div class="tk"><i data-w="${DATA.dims[k]}"></i></div></div>`).join('');
const SUB = `匹配度 ${O}，过了 ${DATA.threshold} 分的初筛线。下面还有几处可以写得更好，面试前值得先改。`;
const RING = () => `<div class="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="50"/><circle class="b" cx="60" cy="60" r="50"/></svg><div class="num"><span data-count>0</span></div></div>`;
let mode = 'new', tab = 'gap', active = null, place = 'card', iv = 'done';
const IVS = {
  none: [],
  live: ['<a class="ap-pill live" href="#"><span class="m">模拟面试</span>进行中 · 第 3 / 5 个话题<span class="act">继续 →</span></a>'],
  done: ['<a class="ap-pill" href="#"><span class="m">模拟面试</span>今天<b>72 分</b><span class="v-ok">通过</span><span class="act">报告 →</span></a>',
         '<a class="ap-pill" href="#"><span class="m">模拟面试</span>10 月 6 日<b>54 分</b><span class="v-no">没过</span><span class="act">报告 →</span></a>'],
};
const IV = (cls) => IVS[iv].length ? `<div class="rv-iv ${cls}"><span class="k">面试记录</span><div class="pills">${IVS[iv].join('')}</div></div>` : '';
const CTA = () => iv === 'live'
  ? '<button class="btn accent lg magnetic">继续面试 <span class="arrow">→</span></button><button class="btn outline lg magnetic">再投一个</button>'
  : '<button class="btn accent lg magnetic">进入模拟面试 <span class="arrow">→</span></button><button class="btn outline lg magnetic">再投一个</button>';

function renderNow() {
  $('main').innerHTML = `<section class="screen">
    <div>
      <span class="tag fade d1"><b>初筛结果</b>${esc(DATA.job_title)}</span>
      <h1><span class="line"><span>通过初筛，</span></span><span class="line"><span>可以去${MARK('面试')}了。</span></span></h1>
      <p class="sub fade d2">${SUB}</p>
      <div class="score-hero fade d2">${RING()}<div class="dims">${DIMS}</div></div>
      <div class="cta fade d3"><button class="btn accent lg magnetic">进入模拟面试 <span class="arrow">→</span></button><button class="btn outline lg magnetic">再投一个</button></div>
    </div>
    <div class="stage fade d4">
      <div class="floaty"><b>${O} / ${DATA.threshold}</b><span>匹配度 / 初筛线</span></div>
      <div class="card tilt">
        <div class="card-head">
          <div class="tabs" id="tabs" style="--i:${tab === 'gap' ? 0 : 1}"><span class="knob"></span><button class="${tab === 'gap' ? 'on' : ''}" data-tab="gap">对照岗位 · ${LISTS.gap.length}</button><button class="${tab === 'self' ? 'on' : ''}" data-tab="self">简历本身 · ${LISTS.self.length}</button></div>
          <button class="link" data-open="">查看简历原文 →</button>
        </div>
        <div class="issues" id="issues">${LISTS[tab].map((x, i) => issueHtml(x, i, true)).join('')}</div>
      </div>
    </div>
  </section>`;
}

function renderNew() {
  $('main').innerHTML = `<section class="rv">
    <div class="rv-band">
      <div>
        <span class="tag fade d1"><b>初筛结果</b>${esc(DATA.job_title)}</span>
        <h1><span class="line"><span>通过初筛，可以去${MARK('面试')}了。</span></span></h1>
        <p class="rv-sub fade d2">${SUB.replace('。', '。<br>')}</p>
        <div class="cta fade d3">${CTA()}</div>
        ${place === 'below' ? IV('below fade d3') : ''}
      </div>
      <div class="rv-score fade d2${place === 'card' && IVS[iv].length ? ' has-iv' : ''}">${RING()}<div class="dims">${DIMS}</div>${place === 'card' ? IV('') : ''}</div>
    </div>
    <div class="rv-body">
      <div class="rv-list">
        <div class="rv-sec"><div class="rv-h"><h3>对照岗位<span>${LISTS.gap.length} 条没满足或只满足一部分 · 重要的在前</span></h3></div>${LISTS.gap.map((x, i) => issueHtml(x, i, true)).join('')}</div>
        <div class="rv-sec"><div class="rv-h"><h3>简历本身<span>${LISTS.self.length} 处可以写得更好 · 严重的在前</span></h3></div>${LISTS.self.map((x, i) => issueHtml(x, i + LISTS.gap.length, true)).join('')}</div>
      </div>
      <div class="rv-col"><div class="rv-side fade d3">
        <div class="rv-h"><h3>简历原文<span>${esc(DATA.resume_title)}</span></h3>
          <div class="legend"><span><i class="bad"></i>简历问题</span><span><i class="part"></i>部分满足</span><span><i class="good"></i>满足</span></div></div>
        <aside class="rv-paper">
          <div class="rv-msg hint show" id="rvMsg">点左边任意一条，这里会定位到简历里对应的那一句。</div>
          <div class="paper-wrap" id="rvWrap"><div class="paper">${paperHtml()}</div></div>
        </aside>
      </div></div>
    </div>
  </section>`;
}

const wide = () => matchMedia('(min-width: 1001px)').matches;
/** 「改后」宽屏时原文常驻在右边，条目里就不需要「在原文中查看」按钮 */
function syncLocate() { document.querySelectorAll('.rv .loc').forEach(l => l.style.display = wide() ? 'none' : ''); }

function render() {
  active = null;
  mode === 'now' ? renderNow() : renderNew();
  wire($('main')); syncLocate();
  document.querySelectorAll('.demo-flag [data-place]').forEach(b => b.classList.toggle('on', b.dataset.place === place));
  document.querySelectorAll('.demo-flag [data-iv]').forEach(b => b.classList.toggle('on', b.dataset.iv === iv));
  setTimeout(() => {
    document.querySelectorAll('.ring .b').forEach(c => c.style.strokeDashoffset = 314.2 * (1 - O / 100));
    document.querySelectorAll('.dim .tk i').forEach(i => i.style.width = i.dataset.w + '%');
    const t0 = performance.now();
    (function tick(t) { const k = Math.min(1, (t - t0) / 1400); document.querySelectorAll('[data-count]').forEach(n => n.textContent = Math.round(O * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(tick); })(t0);
  }, 500);
}
addEventListener('resize', syncLocate);

/** 「改后」：展开一条 = 右边定位到它；没有位置的条目在纸面上方说明一句 */
function activate(issue, open) {
  const item = BY_KEY[issue.dataset.key];
  document.querySelectorAll('.rv .issue.active').forEach(x => x.classList.remove('active'));
  issue.classList.add('active'); active = item;
  if (open !== undefined) { issue.classList.toggle('open', open); if (open) startAdvice(item.key); }
  if (!wide()) return;
  const msg = $('rvMsg');
  msg.classList.remove('hint');
  msg.classList.toggle('show', !located(item));
  if (!located(item)) msg.textContent = item.list === 'gap' ? '简历里没有找到能证明「' + item.text + '」的内容 —— 这正是需要补上的地方。' : '这条针对整份简历，没有具体的某一句。';
  pointAt($('rvWrap'), item);
}

document.addEventListener('click', e => {
  if (e.target.closest('#palBtn')) return openPalette(!$('pal').classList.contains('open'));
  const pal = e.target.closest('.pal-opt');
  if (pal) { setPalette(pal.dataset.pal, true); return openPalette(false); }
  if (!e.target.closest('#pal')) openPalette(false);
  const pl = e.target.closest('.demo-flag [data-place]');
  if (pl) { place = pl.dataset.place; return render(); }
  const st = e.target.closest('.demo-flag [data-iv]');
  if (st) { iv = st.dataset.iv; return render(); }
  if (e.target.closest('.ap-pill')) e.preventDefault();
  const tabBtn = e.target.closest('#tabs button');
  if (tabBtn) { tab = tabBtn.dataset.tab; return render(); }
  const open = e.target.closest('[data-open]');
  if (open) return openSheet(open.dataset.open || null);
  const row = e.target.closest('.issue-row');
  if (row) {
    const issue = row.parentElement, willOpen = !issue.classList.contains('open');
    if (mode === 'new') return activate(issue, willOpen);
    if (issue.classList.toggle('open')) startAdvice(issue.dataset.key);
    return;
  }
  const seg = e.target.closest('#rvWrap .hl');
  if (seg) {
    const item = pickFromSeg(seg);
    const issue = document.querySelector(`.rv .issue[data-key="${item.key}"]`);
    if (!issue) { $('rvMsg').classList.remove('show', 'hint'); return pointAt($('rvWrap'), item); }     // 满足的要求只在纸面上
    issue.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' });
    activate(issue, true);
  }
});
/* 「改后」：鼠标停在一条上，原文里对应的句子先亮一下 */
document.addEventListener('mouseover', e => {
  const issue = mode === 'new' && e.target.closest('.rv .issue');
  document.querySelectorAll('#rvWrap .hl.peek').forEach(s => s.classList.remove('peek'));
  if (!issue) return;
  document.querySelectorAll('#rvWrap .hl').forEach(s => { if (s.dataset.keys.split(' ').includes(issue.dataset.key)) s.classList.add('peek'); });
});

/** 换配色：只改 <html data-pal>，切换时颜色渐变过去 */
function setPalette(name, animate) {
  const root = document.documentElement;
  if (animate) { root.classList.add('theming'); setTimeout(() => root.classList.remove('theming'), 420); }
  root.dataset.pal = name; store.set('rl-pal', name);
  document.querySelectorAll('.pal-opt').forEach(b => { b.classList.toggle('on', b.dataset.pal === name); b.setAttribute('aria-checked', b.dataset.pal === name); });
}
function openPalette(open) { $('pal').classList.toggle('open', open); $('palBtn').setAttribute('aria-expanded', open); }
addEventListener('keydown', e => { if (e.key === 'Escape') openPalette(false); });
const saved = store.get('rl-pal');
setPalette(['linkedin', 'red', 'green'].includes(saved) ? saved : 'linkedin', false);   // 存的是下线了的配色就回到默认
render();
</script>
</body>
</html>
