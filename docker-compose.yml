# 部署 / 答辩演示用：docker compose up -d --build
# 开发期只起依赖：docker compose up -d mysql redis   （后端与前端本地跑）
services:
  mysql:
    image: mysql:8.0
    container_name: resume-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-resume_ai}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 数据卷为空（首次启动）时，MySQL 镜像会自动执行此目录下的 .sql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-your_password}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: resume-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: resume-backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-your_password}@mysql:3306/${MYSQL_DATABASE:-resume_ai}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 单 worker：BackgroundTasks 在接收请求的进程内执行，启动清理依赖单进程假设
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  nginx:
    image: nginx:alpine
    container_name: resume-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
